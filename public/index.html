             rows,{click:r=>{ const i=r.id!=null?r.id:D.players.indexOf(r.name);
               if(i>=0) go('players',{p:i}); else go('games',{q:r.name}); }});
}

/* Only the running season has a ladder. The awards are listed and nothing
   else: they were decided when they were decided, and a formula sharpened
   afterwards does not get a vote on them. */
function mvpBlock(){
  const out=E('div'), cur=SEASONS[SEASONS.length-1];
  const Y=cur, L=mvpLadder(Y);
  out.appendChild(secH('The MVP Ladder · '+Y));
  out.appendChild(E('p','lede','The league’s season-MVP formula, run against its own regular-season numbers after '+
    L.weeks+' weeks. It asks who was most valuable to the team that rostered them, which is not the same question as who scored the most.'+
    (L.weeks>1?' The arrows are the move since the ladder stood after Week '+(L.lastWeek-1)+'; NR means he had not qualified yet.':'')));

  const g1=E('div','grid-auto'); g1.style.marginBottom='18px';
  const top=L.rows[0];
  g1.appendChild(tile(top.name.split(' ').slice(-1)[0],'Leader',top.name+' · '+f2(top.score)));
  g1.appendChild(tile(L.rows.filter(r=>r.war>0).length,'Players with a WAR','Won a week their team would otherwise have lost'));
  g1.appendChild(tile(L.rows.filter(r=>r.lbr>0).length,'Players with an LBR','Cost a week a replacement would have won'));
  g1.appendChild(tile(L.rows.length,'Qualified','Played at least '+L.minG+' of '+L.weeks+' weeks'));
  out.appendChild(g1);

  out.appendChild(mvpTable(L.rows.slice(0,40),false,mvpMoves(L)));

  out.appendChild(secH('Past Winners'));
  out.appendChild(E('p','lede','Every MVP the league has awarded. The award is the record: each was decided on the season it was given in, and a formula sharpened since then does not get a vote on it — which is why only the running season has a ladder.'));
  const past=SEASONS.slice().reverse().map(y=>{
    const l=mvpLadder(y), won=AWARDED[y];
    return {y,won,row:won?l.rows.find(r=>r.name===won):l.rows[0]};
  });
  out.appendChild(tbl([
    {h:'Season',f:r=>r.y===cur?r.y+' <span class="pill">live</span>':String(r.y)},
    {h:'MVP',f:r=>r.won?'<strong>'+r.won+'</strong>'
      :'<strong>'+r.row.name+'</strong> <span class="pill">leading</span>'},
    {h:'Pos',f:r=>r.row?r.row.pos:'—'},
    {h:'Rostered by',f:r=>r.row?r.row.mgr:'—'},
    {h:'PF/G',r:true,n:true,sm:false,f:r=>r.row?f2(r.row.pfg):'—'},
    {h:'GP',r:true,n:true,sm:false,f:r=>r.row?r.row.gp:'—'}
  ],past,{nofilter:true}));

  out.appendChild(secH('Replacement Values · '+L.year));
  out.appendChild(E('p','lede','What you could expect from the waiver wire at each position: this league’s QB2s, RB3s, WR4s and TE2s, scored over every week somebody held them — the blanks count, because on the wire they do. Rebuilt each week while a season is live, then fixed, so a finished ladder never moves.'));
  out.appendChild(tbl([
    {h:'Position',f:r=>'<strong>'+r[0]+'</strong>'},
    {h:'The band',f:r=>r[0]+MVP_BAND[r[0]][0]+'–'+MVP_BAND[r[0]][1]},
    {h:'Replacement value',r:true,n:true,f:r=>f2(r[1])+' pts'},
    {h:'Qualified for the ladder',r:true,n:true,sm:false,f:r=>L.qualified[r[0]]}
  ],Object.entries(L.RV),{nofilter:true}));

  out.appendChild(secH('How the Formula Works'));
  const faq=E('div','faq'), a=E('div'), b=E('div');
  const card=(host,t,body)=>{const d=E('div','card');d.appendChild(E('h3',null,t));
    body.forEach(x=>{const p=E('p');p.innerHTML=x;d.appendChild(p)});host.appendChild(d)};
  card(a,'The argument',[
    'The usual answers — most points per game, or the biggest gap over the next player at the position — measure production. They do not measure what a player was worth to the one team that actually had him.',
    'Take two managers. One drafts perfectly and wins every week by thirty; his best back is the best in the league, but the team would have won most of those weeks without him. The other manager’s season is held together by a single player who delivers five wins the team had no business getting. The first player had the better year. The second was more valuable.',
    'So the formula rewards production, then adds a much heavier term for the weeks a player actually decided.']);
  card(a,'Wins Above Replacement',[
    'A WAR is earned when a manager wins a week that they would have lost had that player been swapped for a replacement-level starter:',
    '<span class="num">PF − PP + RV &lt; PA</span> — your total, minus his points, plus what the waiver wire would have given you, still short of your opponent.',
    'It only applies in weeks the team won. You cannot bail out a loss.']);
  card(b,'A real one',[
    'Week 1: <strong>Bijan Robinson</strong> scores 31.30 and Nick wins 120.26–117.00. Replace him with a replacement-level back and Nick puts up <span class="num">120.26 − 31.30 + '+f2(L.RV.RB)+' = '+f2(120.26-31.30+L.RV.RB)+'</span>, which loses to 117.00. WAR earned.',
    'Week 5 he scores 15.80 in a 130.14–113.80 win. Without him: <span class="num">'+f2(130.14-15.80+L.RV.RB)+'</span>, still ahead. A fine game, no WAR — the week was never in doubt.']);
  card(b,'Losses Below Replacement',[
    'The mirror image, and the only negative term. If a team loses a week it would have won with replacement-level production in that slot, the player takes an LBR.',
    'WAR rewards showing up when it counted. LBR punishes disappearing when the bar was on the floor. Both are weighted ×4, so a single one of either moves a player further than two points a game.']);
  faq.appendChild(a); faq.appendChild(b); out.appendChild(faq);

  out.appendChild(secH('The Terms'));
  out.appendChild(E('p','lede','MVP = PF/G + PAR + GP + GW(1.5) + POS(2) + GAR + WAR(4) − LBR(4)'));
  out.appendChild(tbl([
    {h:'Term',f:r=>'<strong>'+r[0]+'</strong>'},{h:'Weight',n:true,f:r=>r[1]},{h:'What it measures',f:r=>r[2]}
  ],[
    ['PF/G','×1','Points per game, by this league’s scoring'],
    ['PAR','×1','Points above replacement — PF/G minus the replacement value at his position'],
    ['GP','×1','Games played, so availability counts'],
    ['GW','×1.5','Weeks he started in a win'],
    ['POS','×2','Points over second place at his position. The position leader is positive, second place is zero, everyone else negative'],
    ['GAR','×1','Games he outscored the replacement value'],
    ['WAR','×4','Wins above replacement'],
    ['LBR','×4 negative','Losses below replacement']
  ],{nofilter:true}));

  const note=E('div','card'); note.style.marginTop='18px';
  note.appendChild(E('h3',null,'Where this version bends the method'));
  ['A player qualifies at '+L.minG+' games, 60% of the weeks played so far. Without a cut-off, one big week off the waiver wire would top the ladder on points per game alone.',
   'Games played is counted as weeks the player scored anything while rostered in this league, since the archive holds fantasy rosters rather than NFL inactives. A genuine zero in a game he played is counted as a week off.',
   'Replacement values come from this league only, and from every man rostered a fortnight or more \u2014 scored over every week he was held, blank weeks included, because that is what the wire actually pays. This early the QB and TE bands run shallower than fourteen deep, so those two are noisier than the RB and WR ones.'
  ].forEach(t=>note.appendChild(E('p',null,t)));
  out.appendChild(note);
  return out;
}

/* What a man left on his bench, what his score would have done against the
   rest of the league that week, and how the pairing has gone all time. */
function weekBench(y,w){
  const out=new Map();
  D.tw.forEach(t=>{ if(t[0]!==y||t[1]!==w||t[2]!==BR_REG)return;
    let tot=0,best=null;
    t[7].forEach(e=>{ if(e[1]||D.slots[e[0]]!=='BE')return;
      tot+=e[4]; if(!best||e[4]>best[0])best=[e[4],D.players[e[2]]]; });
    out.set(D.mgrs[t[3]],{pts:Math.round(tot*100)/100,top:best});
  });
  return out;
}
function weekAllPlay(y,w){
  const sc=[]; D.tw.forEach(t=>{ if(t[0]===y&&t[1]===w&&t[2]===BR_REG)sc.push([D.mgrs[t[3]],t[6]]) });
  const m=new Map();
  sc.forEach(([a,v])=>m.set(a,sc.filter(([b,bv])=>b!==a&&v>bv).length));
  return {beat:m,n:sc.length-1};
}
function topStarter(y,w,mgr){
  const t=D.tw.find(x=>x[0]===y&&x[1]===w&&x[2]===BR_REG&&D.mgrs[x[3]]===mgr);
  if(!t)return null;
  let b=null; t[7].forEach(e=>{ if(e[1]&&(!b||e[4]>b[0]))b=[e[4],D.players[e[2]]] });
  return b;
}
function pairRecord(a,b){
  let aw=0,bw=0,last=null;
  G.forEach(g=>{ if(g.br===BR_CON)return;
    const w=D.mgrs[g.win[3]], l=D.mgrs[g.los[3]];
    if((w===a&&l===b)||(w===b&&l===a)){ w===a?aw++:bw++; last=g; }});
  return {aw,bw,last};
}

/* ---------- the draft ---------- */
/* Sixteen rounds, fourteen teams, snake order, in a basement every August. The
   sheet is missing a handful of late picks, so the board shows the empty slot
   rather than pretending the round was shorter. */
let DSEAS=null;
function startedBy(){     // regular season started points, by season and player, and
  if(DSEAS)return DSEAS;  // again split by the manager who did the starting
  const m=new Map();
  D.tw.forEach(t=>{ if(t[2]!==BR_REG)return;
    const mg=D.mgrs[t[3]];
    t[7].forEach(e=>{
      m.set('had:'+t[0]+':'+e[2]+':'+mg,true);        // on his roster, started or not
      if(!e[1])return;
      [t[0]+':'+e[2], t[0]+':'+e[2]+':'+mg].forEach(k=>{
        const r=m.get(k)||{pts:0,st:0}; r.pts+=e[4]; r.st++; m.set(k,r); });
    })});
  return (DSEAS=m);
}
const DRAFT_RD=16, STEAL_FROM=9;
const DBOARD=new Map();
function draftBoard(y){
  if(DBOARD.has(y))return DBOARD.get(y);
  const SP=startedBy(), S=playerStats().by, dr=D.draft||{}, picks=[];
  Object.keys(dr).forEach(k=>dr[k].forEach(e=>{
    if(e[3]!==y)return;
    const id=+k, mgr=D.mgrs[e[4]], ps=S.get(id);
    // what he gave the man who drafted him, and what he did for everybody that year
    const mine=SP.get(y+':'+id+':'+mgr)||{pts:0,st:0}, all=SP.get(y+':'+id)||{pts:0,st:0};
    picks.push({ov:e[0],rd:e[1],pk:e[2],mgr,id,
                name:D.players[id],pos:ps?ps.pos:'',pts:mine.pts,st:mine.st,
                allPts:all.pts,allSt:all.st,kept:!!SP.get('had:'+y+':'+id+':'+mgr)});
  }));
  picks.sort((a,b)=>a.ov-b.ov);
  // Seats come from the whole board, not from round one: picks change hands.
  // Before the 2025 draft Jon and Guzman swapped firsts, so round one alone
  // would put each man in the other's seat for the fifteen rounds after it.
  const n=Math.max(new Set(picks.map(p=>p.mgr)).size,...picks.map(p=>p.pk),1);
  const seatOf=p=>(p.rd%2?p.pk:n+1-p.pk)-1;
  const votes=[]; picks.forEach(p=>{ const s=seatOf(p), v=votes[s]||(votes[s]={});
    v[p.mgr]=(v[p.mgr]||0)+1 });
  const order=[]; votes.forEach((v,i)=>{ order[i]=Object.keys(v).sort((a,b)=>v[b]-v[a])[0] });
  // men who were drafted and cut before week 1 are in no boxscore, so they have
  // no profile to link to — the board still names them
  (D.draftx||[]).forEach(r=>{ if(r[0]!==y)return;
    picks.push({ov:(r[1]-1)*n+r[2],rd:r[1],pk:r[2],mgr:D.mgrs[r[3]],id:null,
                name:r[4],pos:'',pts:0,st:0,allPts:0,allSt:0}); });
  picks.sort((a,b)=>a.ov-b.ov);
  picks.slice().sort((a,b)=>b.pts-a.pts).forEach((p,i)=>p.fin=i+1);
  const got=new Map(picks.map(p=>[p.rd+'.'+p.pk,p]));
  const slots=[];
  for(let rd=1;rd<=DRAFT_RD;rd++) for(let pk=1;pk<=n;pk++){
    const seat=order[(rd%2?pk:n+1-pk)-1], p=got.get(rd+'.'+pk);
    // a traded pick belongs to the man who used it, with the seat it came from
    slots.push({rd,pk,seat,mgr:p?p.mgr:seat,ov:(rd-1)*n+pk,p,
                from:p&&p.mgr!==seat?seat:null});
  }
  const out={picks,slots,order:order.filter(Boolean),n};
  DBOARD.set(y,out); return out;
}
VIEWS.draft=()=>{
  const out=E('div');
  out.appendChild(secH('The Draft'));
  out.appendChild(E('p','lede','Sixteen rounds, snake order, full PPR, and everyone in the same room \u2014 the league has drafted in person every year since 2020. A pick is credited with what he scored for the manager who drafted him, in that season\u2019s regular season, while actually in his lineup. Draft a man and cut him and the pick is worth nothing, however well he did elsewhere.'));
  const YS=SEASONS.slice().sort((a,b)=>a-b);
  const y=YS.indexOf(STATE.dy)>=0?STATE.dy:YS[YS.length-1];
  const ctl=E('div','ctl');
  ctl.appendChild(E('span','pill','Season'));
  const sy=E('select'); YS.slice().reverse().forEach(v=>{const o=E('option',null,v);o.value=v;sy.appendChild(o)});
  sy.value=y; sy.onchange=()=>{STATE=Object.assign({},STATE,{dy:+sy.value}); render()};
  ctl.appendChild(sy); out.appendChild(ctl);
  const dv=STATE.dv==='team'?'team':'round';
  const bar=E('div','wkbar');
  [['round','By round'],['team','By team']].forEach(([k,t])=>{
    const btn=E('button',null,t);
    btn.setAttribute('aria-pressed',k===dv?'true':'false');
    btn.onclick=()=>{STATE=Object.assign({},STATE,{dv:k}); render()};
    bar.appendChild(btn);
  });
  out.appendChild(bar);

  const B=draftBoard(y);
  if(!B.picks.length){ out.appendChild(E('p','empty','No draft on file for '+y+'.')); return out }

  // picks that changed hands before the draft, which the seats alone would hide
  const moved=B.slots.filter(sl=>sl.from);
  if(moved.length){
    const grp=new Map();
    moved.forEach(sl=>{ const k=sl.from+'\u0001'+sl.mgr;
      (grp.get(k)||grp.set(k,[]).get(k)).push(sl.rd+'.'+String(sl.pk).padStart(2,'0')) });
    const leg=[...grp.entries()].map(([k,v])=>{ const [f,t]=k.split('\u0001');
      return v.join(' and ')+' from '+f+' to '+t }).join('  ·  ');
    const only=SEASONS.filter(yy=>draftBoard(yy).slots.some(sl=>sl.from)).length===1;
    out.appendChild(E('p','dtrade','Picks that changed hands: '+leg+'.'+
      (only?' The only draft-pick trade in league history.':'')));
  }

  // the three picks people still bring up. Measuring the steal by how far a man
  // outran his slot just crowns the best sixteenth-rounder every time, so it is
  // simply the biggest score out of the back half of the draft.
  const best=(arr,f)=>arr.length?arr.reduce((a,b)=>f(b)>f(a)?b:a):null;
  const steal=best(B.picks.filter(p=>p.rd>=STEAL_FROM),p=>p.pts);
  // the bust is about the player, not the manager: the fewest points anyone got
  // out of a first-three-rounds pick all year. A tie goes to whoever went earlier.
  const bust=B.picks.filter(p=>p.ov<=B.n*3)
    .sort((a,b)=>a.allPts-b.allPts||a.ov-b.ov)[0]||null;
  const lastSlot=[...B.slots].reverse().find(sl=>sl.p);
  const card=(h,p,note)=>{
    const c=E('div','card');
    c.appendChild(E('h3',null,h));
    if(!p){ c.appendChild(E('p','lede','\u2014')); return c }
    const nm=p.id===null?E('span','plink dcut',p.name):E('button','plink',p.name);
    if(p.id!==null) nm.onclick=()=>go('players',{p:p.id});
    const line=E('p'); line.style.margin='2px 0 4px'; line.appendChild(nm);
    c.appendChild(line);
    c.appendChild(E('p','lede','Round '+p.rd+', pick '+p.pk+' to '+p.mgr+'  \u00b7  '+
      f2(note==='all'?p.allPts:p.pts)+' pts'+(note==='all'?' all season':', '+ord(p.fin)+' of the class')));
    return c;
  };
  const g=E('div','ap'), sofar=CHAMP[y]?'':' so far';   // a season still running has no verdict yet
  g.appendChild(card('Steal of the draft'+sofar,steal));
  g.appendChild(card('Draft-day bust'+sofar,bust,'all'));
  g.appendChild(card('Mr. Irrelevant',lastSlot&&lastSlot.p));
  out.appendChild(g);
  out.appendChild(E('p','lede','The steal is the most points a manager got out of his own round '+
    STEAL_FROM+'-or-later pick, counting only weeks the man was in his lineup. The bust has nothing to do with managers: it is the first-three-rounds pick who scored the fewest points for anybody all season.'));

  // one row, whichever way the board is sliced: the slot, the man, and the
  // thing the other column already tells you (his manager, or what he scored)
  const pickRow=(sl,lab,tail)=>{
    const r=E('div','dpick');
    r.appendChild(E('span','sl',lab));
    if(sl.p&&sl.p.id!==null){
      const b=E('button','plink',sl.p.name); b.onclick=()=>go('players',{p:sl.p.id});
      r.appendChild(b);
    } else if(sl.p) r.appendChild(E('span','plink dcut',sl.p.name));
    else r.appendChild(E('span','dmiss','not recorded'));
    if(sl.from){ const t=E('span','dfrom','from '+sl.from); t.title='Acquired from '+sl.from; r.appendChild(t) }
    r.appendChild(E('span','dp',sl.p?tail:'\u2014'));
    return r;
  };

  if(dv==='team'){
    out.appendChild(secH('By team'));
    const teams=E('div','dteams');
    B.order.forEach(mg=>{
      const c=E('div','card'), mine=B.slots.filter(sl=>sl.mgr===mg);
      const tot=mine.reduce((a,sl)=>a+(sl.p?sl.p.pts:0),0);
      c.appendChild(E('h3',null,mg));
      c.appendChild(E('p','lede',f2(tot)+' points off the board'));
      mine.forEach(sl=>c.appendChild(pickRow(sl,sl.rd+'.'+String(sl.pk).padStart(2,'0'),
        sl.p?(sl.p.pos||''):'')));
      teams.appendChild(c);
    });
    out.appendChild(teams);
  } else {
    out.appendChild(secH('By round'));
    const rounds=E('div','dteams wide');
    for(let rd=1;rd<=DRAFT_RD;rd++){
      const c=E('div','card'), mine=B.slots.filter(sl=>sl.rd===rd);
      c.appendChild(E('h3',null,'Round '+rd));
      c.appendChild(E('p','lede','Picks '+((rd-1)*B.n+1)+'\u2013'+(rd*B.n)));
      mine.forEach(sl=>c.appendChild(pickRow(sl,String(sl.pk),sl.mgr)));
      rounds.appendChild(c);
    }
    out.appendChild(rounds);
  }

  // and the whole board, sortable
  out.appendChild(secH('Every pick'));
  out.appendChild(E('p','lede','Click a heading to sort \u2014 by points to find the steals, by round to walk the board.'));
  out.appendChild(tbl([
    {h:'Pick',r:true,n:true,f:p=>String(p.ov),filter:false},
    {h:'Rd',r:true,n:true,f:p=>String(p.rd)},
    {h:'Manager',f:p=>p.mgr},
    {h:'Player',filter:false,
     f:p=>p.id===null?'<span style="opacity:.6">'+p.name+'</span>':'<strong>'+p.name+'</strong>'},
    {h:'Pos',f:p=>p.pos||'\u2014'},
    {h:'Starts',r:true,n:true,f:p=>String(p.st),filter:false},
    {h:'Points',r:true,n:true,f:p=>f2(p.pts),filter:false},
    {h:'All managers',r:true,n:true,sm:false,filter:false,
     f:p=>p.allPts>p.pts+0.001?'<span style="opacity:.6">'+f2(p.allPts)+'</span>':'<span style="opacity:.3">\u2014</span>'},
    {h:'Class rank',r:true,n:true,f:p=>ord(p.fin),filter:false}
  ],B.picks,{click:p=>{ if(p.id!==null) go('players',{p:p.id}) }}));
  return out;
};

/* ---------- shell ---------- */

function go(v,st){
