<style>
/* Layout: fixed section rail under a masthead; each view is one column, the Scorigami board breaks wider */
:root{
  --bg:#f1ece8; --panel:#fbf8f6; --panel2:#e9e1dc;
  --fg:#1d1715; --muted:#6f625c; --line:#dbcfc8; --line2:#c8b9b1;
  --accent:#9c3218; --accent2:#c25d40; --gold:#8a6e30;
  --good:#2f6b4f; --bad:#8c3030;
  --heat1:#efd9d2; --heat2:#d79a85; --heat3:#b85c3c; --heat4:#8d2a12;
  --sg-claimed:#00b050; --sg-void:#0c0c0c; --sg-cell:#ffffff; --sg-line:#e2dcd7;
  --sg-y0:#004dd6; --sg-y1:#407dd6; --sg-y2:#78aad6; --sg-y3:#ffd579; --sg-y4:#ffaf00; --sg-y5:#ff7c00; --sg-y6:#d81e00;
  --sg-new:#d81e00; --sg-rep:#ffaf00; --sg-old:#c3d9c2;
  --f-disp:'Barlow Condensed','Helvetica Neue',Arial,sans-serif;
  --f-body:'Newsreader',Georgia,'Times New Roman',serif;
  --f-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
/* Light is the default for everyone; dark is opt-in through the toggle. */
:root[data-theme="dark"]{
  --bg:#15110f; --panel:#1f1a17; --panel2:#282120;
  --fg:#ece4df; --muted:#9e8f88; --line:#352c28; --line2:#4a3e39;
  --accent:#e0603f; --accent2:#f08a6a; --gold:#c9a456;
  --good:#5fa37d; --bad:#d46a60;
  --heat1:#3a241e; --heat2:#6d3522; --heat3:#a9492a; --heat4:#e0603f;
  --sg-void:#000000; --sg-cell:#120f0d; --sg-line:#2a2321;
  --sg-old:#2c3f2d;
  color-scheme:dark;
}
/* Color-blind mode. The season ramp runs blue through yellow to red, and at
   the hot end a deuteranope reads three shades of the same mud; the red and
   green in the tables have the same trouble. These palettes carry their
   meaning in lightness instead of hue — every ramp climbs steadily from dark
   to light — and the one pair that stays a pair is blue against orange. */
:root[data-cvd="1"]{
  --good:#1f6feb; --bad:#c05600;
  --heat2:#9ecae1; --heat3:#4292c6; --heat4:#08519c;
  --sg-claimed:#2c6fa8;
  --sg-y0:#00224e; --sg-y1:#234a85; --sg-y2:#5c6a7d; --sg-y3:#7c7b78; --sg-y4:#a59c74; --sg-y5:#d3c164; --sg-y6:#fee838;
  --sg-new:#d95f02; --sg-rep:#1f6feb; --sg-old:#c3ccd3;
}
:root[data-theme="dark"][data-cvd="1"]{
  --heat2:#13375f; --heat3:#2b6ca3; --heat4:#79b6e2;
  --sg-y0:#2d4f80; --sg-y1:#4a6585; --sg-y2:#677b87; --sg-y3:#86917f; --sg-y4:#a7a873; --sg-y5:#cbc266; --sg-y6:#fee838;
  --sg-old:#2b3640;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:18px}

/* masthead */
header.mast{border-bottom:1px solid var(--line);background:var(--panel)}
.mast .wrap{padding-block:16px 0}
.kicker{font-family:var(--f-disp);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (min-width:620px){.kicker .sp{margin-left:auto}}
@media (max-width:620px){
  .kicker{font-size:10px;letter-spacing:.16em;gap:8px}
  .ctl{gap:7px;margin-bottom:13px}
  button.btn{padding:6px 9px;font-size:11.5px;letter-spacing:.08em}
  select,input[type=search]{padding:6px 8px;font-size:13px}
  .pill{font-size:9.5px;padding:2px 5px}
  .board-wrap{padding:9px}
  .sub{margin-bottom:11px}
}
.brand{display:flex;align-items:center;gap:clamp(10px,2vw,20px);margin:6px 0 0}
.brand-t{min-width:0}
.crest{flex:0 0 auto;width:clamp(52px,10vw,104px);height:auto;display:block}
.title{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,8.2vw,74px);line-height:.92;margin:0 0 2px;text-transform:uppercase;letter-spacing:-.01em}
.sub{font-family:var(--f-disp);font-size:clamp(11px,2.6vw,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:0}
.brand+.rail{margin-top:14px}
nav.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);
  box-shadow:0 1px 0 var(--line), 14px 0 10px -12px var(--line2) inset, -14px 0 10px -12px var(--line2) inset}
nav.rail::-webkit-scrollbar{display:none}
nav.rail button{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  font-family:var(--f-disp);font-size:14px;letter-spacing:.11em;text-transform:uppercase;padding:9px 13px;cursor:pointer}
nav.rail button:hover{color:var(--fg)}
nav.rail button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.theme{appearance:none;background:none;border:1px solid var(--line2);color:var(--muted);flex:0 0 auto;
  border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.theme:hover{color:var(--accent);border-color:var(--accent)}

/* generic */
main{padding-block:26px 56px}
section.view{display:block}
h2.sec{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:7px;margin:34px 0 16px}
h2.sec:first-child{margin-top:0}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin:0 0 18px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.grid-auto{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,152px),1fr))}
@media (min-width:700px){.grid-auto{gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);padding:13px 15px}
.tile .v{font-family:var(--f-disp);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tile .n{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ylink{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;
  font-variant-numeric:tabular-nums}
.ylink:after{content:' \25be';font-size:9px;opacity:.5}
.ylink.on:after{content:' \25b4';opacity:.9}
tr.glog{display:none}
tr.glog.on{display:table-row}
tr.glog>td{padding:0 0 10px;border-top:0}
table.glg{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
table.glg td{padding:4px 10px;border-top:1px solid var(--line);white-space:nowrap}
table.glg tr:hover td{background:var(--bg)}
.htag{font-family:var(--f-disp);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);padding:1px 5px;color:var(--muted);white-space:nowrap}
.htag.g{border-color:var(--accent);color:var(--accent)}
tr.tot td{border-top:2px solid var(--fg);background:var(--panel)}
.wn{color:var(--accent);font-weight:600}
.ls{opacity:.5}
tr.more td{text-align:center;padding:10px 0 2px}
.mb{font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);background:none;border:1px solid var(--line);padding:6px 14px;cursor:pointer}
.mb:hover{color:var(--fg);border-color:var(--fg)}
/* hint that a table runs wider than the screen */
.scroll{background:linear-gradient(to right,var(--bg) 30%,transparent) left/40px 100% no-repeat,
  linear-gradient(to left,var(--bg) 30%,transparent) right/40px 100% no-repeat,
  radial-gradient(farthest-side at 0 50%,var(--line2),transparent) left/14px 100% no-repeat,
  radial-gradient(farthest-side at 100% 50%,var(--line2),transparent) right/14px 100% no-repeat;
  background-attachment:local,local,scroll,scroll}
@media (max-width:560px){.h-sm{display:none}}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:6px 18px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
th:last-child,td:last-child{padding-right:0}
td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--panel)}
/* sortable / filterable headers */
th.hd{white-space:nowrap}
th.hd .hl{cursor:pointer;user-select:none}
th.hd .hl:hover{color:var(--fg)}
th.hd.srt .hl{color:var(--accent)}
th.hd.srt .hl::after{content:' ▲';font-size:8px;vertical-align:1px}
th.hd.srt.dn .hl::after{content:' ▼'}
th.hd .fb{appearance:none;background:none;border:0;cursor:pointer;color:var(--line2);
  font-size:10px;padding:0 2px;margin-left:4px;line-height:1;vertical-align:1px}
th.hd .fb:hover{color:var(--accent)}
th.hd .fb.on{color:var(--accent);font-weight:700}
.fmenu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 6px 22px rgba(0,0,0,.14);max-height:min(60vh,340px);overflow-y:auto;min-width:148px;padding:4px}
.fmenu .fi{display:flex;justify-content:space-between;gap:12px;width:100%;appearance:none;background:none;
  border:0;text-align:left;cursor:pointer;font-family:var(--f-body);font-size:13.5px;color:var(--fg);
  padding:6px 9px;line-height:1.25}
.fmenu .fi:hover{background:var(--panel2)}
.fmenu .fi.on{color:var(--accent);font-weight:600}
.fmenu .fi.nil{opacity:.4}
.fmenu .fn{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.mv{font-family:var(--f-data);font-size:11px;white-space:nowrap;letter-spacing:.02em}
.mv.up{color:var(--good)}
.mv.dn{color:var(--bad)}
.mv.sm{color:var(--line2)}
.mv.nr{font-size:9px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line2);padding:1px 3px}
.pill{display:inline-block;font-family:var(--f-disp);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line2);color:var(--muted)}
.pill.e{border-color:var(--accent);color:var(--accent)}
.pill.w{border-color:var(--gold);color:var(--gold)}
.ring{color:var(--gold)}
.ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input[type=search],input[type=text]{font-family:var(--f-disp);font-size:14px;letter-spacing:.04em;background:var(--panel);
  color:var(--fg);border:1px solid var(--line2);padding:7px 9px;max-width:100%}
input[type=search]{font-family:var(--f-body);letter-spacing:0}
button.btn{appearance:none;font-family:var(--f-disp);font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;
  background:var(--panel);color:var(--fg);border:1px solid var(--line2);padding:7px 11px;cursor:pointer}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button.btn[aria-pressed="true"]:hover{color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* front page */
.hero{border-bottom:2px solid var(--fg);padding-bottom:22px;margin-bottom:22px}
.hero .eyebrow{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .eyebrow .dot{width:4px;height:4px;border-radius:50%;background:var(--line2);flex:0 0 auto}
.hero h1{font-size:clamp(34px,7.4vw,60px);line-height:1;margin:10px 0 0;font-weight:700;letter-spacing:-.005em}
.hero .deck{font-size:clamp(17px,2.6vw,21px);color:var(--muted);max-width:50ch;margin:11px 0 0;line-height:1.38}
.hero-body{margin-top:22px}
.hero-body::after{content:'';display:block;clear:both}
.hero-body figure{margin:0 0 18px}
@media (min-width:880px){.hero-body figure{float:right;width:45%;margin:5px 0 16px 30px}
  .hero-body figure.fig2{float:left;width:37%;margin:6px 28px 14px 0;clear:left}}
.hero-body figure.fig2 img{width:100%}
.hero-body p{margin:0 0 13px}
.hero-body p:first-child::first-letter{font-size:3.1em;line-height:.82;float:left;padding:4px 9px 0 0;color:var(--accent);font-weight:600}
figure{margin:0}
figure img{display:block;width:100%;height:auto;border:1px solid var(--line)}
figcaption{font-size:13px;color:var(--muted);line-height:1.4;margin-top:7px;padding-left:10px;border-left:2px solid var(--accent)}
.strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:var(--panel);margin:0 0 26px}
.strip>div{flex:1 1 140px;padding:12px 15px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .v{font-family:var(--f-disp);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.strip .k{font-family:var(--f-disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.cols{display:grid;gap:26px;grid-template-columns:1fr;align-items:start}
@media (min-width:880px){.cols{grid-template-columns:1.5fr 1fr}}
.faq{display:grid;gap:0 18px;grid-template-columns:1fr}
@media (min-width:760px){.faq{grid-template-columns:1fr 1fr}}
.card.wide img{margin-bottom:11px}
@media (min-width:700px){
  .card.wide{display:grid;grid-template-columns:46% 1fr;column-gap:20px;align-items:start}
  .card.wide h3{grid-column:1/-1}
  .card.wide img{margin:2px 0 0}
  .card.wide .body{min-width:0}
  .card.wide p{max-width:none}}
.card{background:var(--panel);border:1px solid var(--line);padding:15px 17px;margin-bottom:18px}
.card h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.card p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.card p:last-child{margin-bottom:0}
.card img{display:block;width:100%;height:auto;border:1px solid var(--line);margin-bottom:11px}
.res{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover .t{color:var(--accent)}
.res .t{font-family:var(--f-disp);font-size:18px;min-width:0}
.res .t em{font-style:normal;color:var(--muted)}
.res .s{font-family:var(--f-data);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-family:var(--f-disp);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor;margin-left:7px;vertical-align:1px}
.tag.n{color:var(--good)}.tag.r{color:var(--muted)}
.doors{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-top:14px}
.door{display:block;background:var(--panel);border:1px solid var(--line);padding:14px 15px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;font:inherit}
.door:hover{border-color:var(--accent)}
.door .dt{font-family:var(--f-disp);font-size:20px;line-height:1.05}
.door .dd{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}

/* ring counter */
.rg{display:inline-block;width:15px;height:15px;border:1px solid var(--line2);vertical-align:-3px;border-radius:2px}
.rg0{border-color:transparent;background:none}
.rg1{background:var(--panel2)}
.rg2{background:var(--accent2)}
.rg3{background:var(--accent);border-color:var(--accent)}
.rg4{background:var(--gold);border-color:var(--gold)}
.rlegend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-disp);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.rlegend span.i{display:flex;align-items:center;gap:6px}

/* scorigami season dial */
.tl{display:flex;align-items:center;gap:15px;margin:0 0 16px;max-width:620px}
.tl .pl{flex:0 0 auto;width:40px;padding:7px 0;text-align:center;font-size:11px}
.tlr{flex:1 1 auto;min-width:0}
.tl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;padding:0;
  background:none;cursor:pointer;display:block}
.tl input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line2);border-radius:3px}
.tl input[type=range]::-moz-range-track{height:6px;background:var(--line2);border-radius:3px}
.tl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);border:2px solid var(--panel);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.tl input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);
  border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.28)}
.tl .ticks{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10px;
  color:var(--muted);margin-top:2px;padding:0 2px}
.tl .ticks span{cursor:pointer}
.tl .ticks span:hover{color:var(--accent)}
.tl .ticks span.on{color:var(--fg);font-weight:600}
.tl .yr{flex:0 0 auto;text-align:right;min-width:5.2em}
.tl .yr .n{font-family:var(--f-disp);font-size:31px;line-height:.95;font-variant-numeric:tabular-nums;display:block}
.tl .yr small{display:block;font-family:var(--f-disp);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-top:4px}
@media (max-width:560px){.tl{gap:11px}.tl .yr .n{font-size:26px}.tl .yr{min-width:4.6em}}

/* scorigami board */
.board-wrap{background:var(--panel);border:1px solid var(--line);padding:12px;
  width:fit-content;max-width:100%}
.board-scroll{overflow-x:auto}
#board{display:block;image-rendering:pixelated}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--f-data);
  font-size:12px;line-height:1.4;padding:6px 9px;border-radius:3px;white-space:pre-wrap;
  max-width:min(330px,86vw);opacity:0;transition:opacity .08s}
.tip b{font-weight:600;letter-spacing:.03em}

<body>
<header class="mast">
  <div class="wrap">
    <div class="kicker"><span>Est. 2020 · Seven Seasons · 14 Teams</span><span class="sp" id="asof">Through Week 5, 2026</span><button class="theme" id="theme" title="Switch theme" aria-label="Switch theme">◐</button></div>
    <div class="brand">
      <img class="crest" src="logo.png" width="1133" height="1210" alt="" decoding="async">
      <div class="brand-t">
        <div class="title">The Cool League</div>
        <div class="sub">Scorigami · Scoreboards · Boxscores · Record Book</div>
      </div>
    </div>
    <nav class="rail" id="rail"></nav>
  </div>
</header>
<main class="wrap" id="main"><p class="empty">Loading the archive…</p></main>
<div class="tip" id="tip"></div>

<script>
const $=(s,r)=>(r||document).querySelector(s), E=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const R=x=>Math.round(x+1e-9), f2=x=>x.toFixed(2);
const TH=document.documentElement;
try{const t=localStorage.getItem('cl-theme'); if(t)TH.setAttribute('data-theme',t);}catch(e){}
$('#theme').onclick=()=>{const n=TH.getAttribute('data-theme')==='dark'?'light':'dark';
  TH.setAttribute('data-theme',n); try{localStorage.setItem('cl-theme',n)}catch(e){} render();};
/* Remembered per browser, like the theme. Storage can be off or throw, so a
   failed read just means the mode starts off. */
try{if(localStorage.getItem('cl-cvd')==='1')TH.setAttribute('data-cvd','1');}catch(e){}
const cvdOn=()=>TH.getAttribute('data-cvd')==='1';
function setCvd(on){
  if(on)TH.setAttribute('data-cvd','1'); else TH.removeAttribute('data-cvd');
  try{localStorage.setItem('cl-cvd',on?'1':'0')}catch(e){}
  render();
}

let D=null, G=[], BYK=new Map(), CHAMP={}, RUNUP={}, CAREER=new Map(), H2H=new Map(), SEASONS=[];
const BR_REG=0, BR_PO=1, BR_CON=2, PO_FINAL={};
/* The bracket is three rounds, so name them by distance from the final week. */
function roundName(y,w,br){
  if(br===BR_CON) return 'Consolation';
  if(br!==BR_PO) return null;
  const d=(PO_FINAL[y]||0)-w;
  return d===0?'Championship':d===1?'Semi Final':d===2?'Wildcard':'Playoffs';
}

const NEWS=[
 {w:1,hl:'Five new squares · Two repeats · The Diddy Bowl stays perfect'},
 {w:2,hl:'Six new squares · Bobby stays perfect · Max plays both sides again'},
 {w:3,hl:'Bobby’s perfect run ends at sixteen · Bill keeps scoring · Jon keeps not'},
 {w:4,hl:'Brendan breaks the all-time record · Bill falls · Owen and Jon stand alone'},
 {w:5,hl:'Graham talks · Owen goes 5–0 · Bill wins by 93'},
 {w:6,hl:'Five new squares · Guzman starts the wrong quarterback · Owen ties the record'}
];

/* ---------- data prep ---------- */
function prep(d){
  D=d; const M=d.mgrs;
  d.tw.forEach(t=>BYK.set(t[0]+'|'+t[1]+'|'+t[3],t));
  G=[];
  d.tw.forEach(t=>{
    const o=BYK.get(t[0]+'|'+t[1]+'|'+t[4]); if(!o||t[3]>t[4])return;
    const win = t[5]===1?t:o, los = t[5]===1?o:t;
    G.push({y:t[0],w:t[1],br:t[2],a:t,b:o,win:win,los:los,
            total:Math.round((t[6]+o[6])*100)/100, marg:Math.round((win[6]-los[6])*100)/100});
  });
  G.sort((x,y)=>x.y-y.y||x.w-y.w||x.a[3]-y.a[3]);
  SEASONS=[...new Set(d.tw.map(t=>t[0]))].sort();
  // champions
  const fin=PO_FINAL; d.tw.forEach(t=>{if(t[2]===BR_PO)fin[t[0]]=Math.max(fin[t[0]]||0,t[1])});
  for(const y in fin) d.tw.forEach(t=>{ if(t[0]==y&&t[2]===BR_PO&&t[1]===fin[y]) (t[5]===1?CHAMP:RUNUP)[y]=M[t[3]]; });
  // careers (regular season) + playoff record
  // a shared team has no career of its own; its results go to the people who ran it
  M.forEach(m=>{ if(SHARED[m])return;
    CAREER.set(m,{m,seasons:new Set(),w:0,l:0,pf:0,pa:0,g:0,pw:0,pl:0,titles:0,finals:0,po:new Set(),by:new Map()}); });
  d.tw.forEach(t=>{
    const o=BYK.get(t[0]+'|'+t[1]+'|'+t[4]);
    credits(M[t[3]]).forEach(nm=>{
      const c=CAREER.get(nm); if(!c)return;
      c.seasons.add(t[0]);
      if(!c.by.has(t[0]))c.by.set(t[0],{y:t[0],w:0,l:0,pf:0,pa:0,g:0,pw:0,pl:0});
      const s=c.by.get(t[0]);
      if(t[2]===BR_REG){ t[5]===1?(c.w++,s.w++):(c.l++,s.l++); c.pf+=t[6]; c.g++; s.pf+=t[6]; s.g++;
        if(o){c.pa+=o[6]; s.pa+=o[6];} }
      else if(t[2]===BR_PO){ t[5]===1?(c.pw++,s.pw++):(c.pl++,s.pl++); c.po.add(t[0]); }
    });
  });
  for(const y in CHAMP){ CAREER.get(CHAMP[y]).titles++; CAREER.get(CHAMP[y]).finals++; CAREER.get(RUNUP[y]).finals++; }
  // a season only counts against a playoff rate once its bracket has been played
  CAREER.forEach(c=>{ c.cseas=[...c.seasons].filter(y=>PO_FINAL[y]).length; });
  // head to head (regular + playoffs)
  G.forEach(g=>{ if(g.br===BR_CON)return;
    const A1=credits(M[g.win[3]]), B1=credits(M[g.los[3]]);
    A1.forEach(a=>B1.forEach(b=>{
      [[a,b,1],[b,a,0]].forEach(([x,y,won])=>{ const k=x+'|'+y; if(!H2H.has(k))H2H.set(k,{w:0,l:0,pf:0,pa:0});
        const h=H2H.get(k); won?h.w++:h.l++;
        h.pf+=(won?g.win[6]:g.los[6]); h.pa+=(won?g.los[6]:g.win[6]); });
    }));
  });
}
/* "2021 Wk 17" reads like any other week, and it was the final. Name the round. */
const whenLab=(y,w,br)=>y+' '+(roundName(y,w,br)||'Wk '+w);
/* How a season ended, by the round they went out in rather than a 0-1 record. */
function poLab(y,m){
  const gs=G.filter(g=>g.y===y&&g.br===BR_PO&&(owns(D.mgrs[g.win[3]],m)||owns(D.mgrs[g.los[3]],m)))
            .sort((a,b)=>a.w-b.w);
  const dim=t=>'<span style="opacity:.6">'+t+'</span>';
  if(!gs.length) return PO_FINAL[y]?dim('missed'):dim('in progress');
  const last=gs[gs.length-1], won=D.mgrs[last.win[3]]===m, rn=roundName(y,last.w,BR_PO);
  if(won) return last.w===PO_FINAL[y]?'<span class="ring">● Champion</span>':'Won '+rn;
  return 'Lost '+(rn==='Championship'?'final':rn);
}
/* Max and Graham ran one team in 2020. It is stored under a name of its own, and
   these two say who a team's results belong to without duplicating the games. */
const SHARED={'Max & Graham':['Max','Graham']};
const credits=n=>SHARED[n]||[n];
const owns=(n,m)=>n===m||(SHARED[n]||[]).includes(m);
const div=(y,m)=>((D.div[y]||{})[D.mgrs.indexOf(m)])||null;
const elig=()=>G.filter(g=>g.br!==BR_CON);
function squares(maxYear,maxWeek){
  const p=new Map();
  elig().forEach(g=>{ if(maxYear&&(g.y>maxYear||(maxWeek&&g.y===maxYear&&g.w>maxWeek)))return;
    const k=R(g.win[6])+'|'+R(g.los[6]);
    if(!p.has(k))p.set(k,[]); p.get(k).push(g); });
  return p;
}
/* One row per team, under the name the team was kept under — a season shared by
   two managers is one team, not two. */
function teamSeasons(){
  if(teamSeasons.c) return teamSeasons.c;
  const by=new Map();
  D.tw.forEach(t=>{

/* ---------- small renderers ---------- */
/* Every table on the site is built here, so sorting and per-column filtering
   added once shows up everywhere. Row numbering keeps the original rank so a
   filtered view still says where each row stood in the full list. */
function tbl(cols,rows,opt){
  opt=opt||{};
  const strip=v=>v instanceof Node ? v.textContent
    : String(v==null?'':v).replace(/<[^>]*>/g,'').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
  const base=rows.map((r,i)=>({r,i}));
  const text=cols.map(c=>base.map(b=>strip(c.f(b.r,b.i))));
  const num=s=>{const m=String(s).replace(/[,%]/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):NaN};
  // a column is worth filtering when its values actually group the rows
  const opts=cols.map((c,ci)=>{
    if(opt.nofilter||c.filter===false||base.length<5) return null;
    const vals=[...new Set(text[ci].filter(v=>v!==''))];
    // only worth a filter if the values genuinely group rows, not label them
    return (vals.length>1 && vals.length<=14 && vals.length<=base.length*0.55) ? vals.sort((a,b)=>{
      const x=num(a),y=num(b); return isNaN(x)||isNaN(y)?a.localeCompare(b):x-y}) : null;
  });
  const pick={}, sort={ci:null,dir:1};
  let cap=opt.cap||0;                      // 0 means show everything
  const sc=E('div','scroll'), t=E('table'), th=E('thead'), tr=E('tr'), tb=E('tbody');

  cols.forEach((c,ci)=>{
    const h=E('th',(c.r?'r ':'')+(c.sm===false?'h-sm ':'')+'hd');
    if(c.w)h.style.width=c.w;
    const lab=E('span','hl',c.h); h.appendChild(lab);
    if(c.h){ lab.onclick=()=>{ sort.dir=sort.ci===ci?-sort.dir:1; sort.ci=ci; draw(); }; }
    if(opts[ci]){
      const b=E('button','fb','▾'); b.title='Filter by '+(c.h||'value');
      b.onclick=e=>{e.stopPropagation(); menu(b,ci)};
      h.appendChild(b);
    }
    tr.appendChild(h);
  });
  th.appendChild(tr); t.appendChild(th); t.appendChild(tb);

  function menu(anchor,ci){
    closeMenus();
    const m=E('div','fmenu'); m.dataset.open='1';
    const all=E('button','fi'+(pick[ci]==null?' on':''),'All');
    all.onclick=()=>{delete pick[ci];closeMenus();draw()};
    m.appendChild(all);
    // count against the rows the other filters already allow, so the number
    // shown is what selecting it will actually give you
    const pool=base.filter(b2=>cols.every((c2,cj)=>cj===ci||pick[cj]==null||text[cj][b2.i]===pick[cj]));
    opts[ci].forEach(v=>{
      const n=pool.filter(b2=>text[ci][b2.i]===v).length;
      const b=E('button','fi'+(pick[ci]===v?' on':'')+(n?'':' nil'));
      b.appendChild(E('span',null,v)); b.appendChild(E('span','fn',String(n)));
      b.onclick=()=>{pick[ci]=v;closeMenus();draw()};
      m.appendChild(b);
    });
    document.body.appendChild(m);
    const r=anchor.getBoundingClientRect();
    m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left-4))+'px';
    m.style.top=(r.bottom+6)+'px';
    setTimeout(()=>document.addEventListener('click',closeMenus,{once:true}),0);
  }
  function closeMenus(){ document.querySelectorAll('.fmenu').forEach(x=>x.remove()); }

  function draw(){
    tb.innerHTML='';
    let view=base.filter(b=>cols.every((c,ci)=>pick[ci]==null||text[ci][b.i]===pick[ci]));
    if(sort.ci!=null){
      const ci=sort.ci, key=b=>text[ci][b.i];
      view=view.slice().sort((a,b)=>{
        const x=num(key(a)), y=num(key(b));
        const d=(!isNaN(x)&&!isNaN(y))?x-y:key(a).localeCompare(key(b));
        return d*sort.dir;
      });
    }
    // sorting by a column a narrow screen hides is useless if you cannot see it,
    // so it comes back and the columns marked 'dim' step aside to make room
    const extra=sort.ci!=null&&cols[sort.ci].sm===false;
    [...th.querySelectorAll('th')].forEach((h,ci)=>{
      h.classList.toggle('srt',sort.ci===ci);
      h.classList.toggle('dn',sort.ci===ci&&sort.dir<0);
      if(cols[ci].sm===false) h.classList.toggle('h-sm',sort.ci!==ci);
      else if(cols[ci].dim) h.classList.toggle('h-sm',extra);
      const b=h.querySelector('.fb'); if(b)b.classList.toggle('on',pick[ci]!=null);
    });
    const shown=cap?view.slice(0,cap):view;
    shown.forEach(({r,i})=>{
      const x=E('tr',opt.click?'clk':null);
      cols.forEach((c,ci)=>{ const td=E('td',(c.r?'r ':'')+(c.n?'n ':'')+
        ((c.sm===false?sort.ci!==ci:c.dim&&extra)?'h-sm':''));
        const v=c.f(r,i);
        if(v instanceof Node)td.appendChild(v); else td.innerHTML=v==null?'':String(v);
        x.appendChild(td); });
      if(opt.click)x.onclick=()=>opt.click(r);
      tb.appendChild(x);
    });
    if(cap&&view.length>cap){
      const x=E('tr','more'), td=E('td'); td.colSpan=cols.length;
      const b=E('button','mb','Show all '+view.length);
      b.onclick=()=>{cap=0;draw()};
      td.appendChild(b); x.appendChild(td); tb.appendChild(x);
    }
    if(!view.length){ const x=E('tr'), td=E('td',null,'Nothing matches those filters.');
      td.colSpan=cols.length; td.style.cssText='color:var(--muted);font-style:italic;padding:14px 0';
      x.appendChild(td); tb.appendChild(x); }
  }
  draw();
  sc.appendChild(t); return sc;
}

function scoreboard(g,open){
  const M=D.mgrs, box=E('div','sb');
  const hd=E('div','sb-head');
  const rn=roundName(g.y,g.w,g.br);

  hd.appendChild(E('div','mt','Margin '+f2(g.marg)+' · Total '+f2(g.total)));
  box.appendChild(hd);
  [g.win,g.los].forEach(t=>{
    const r=E('div','sb-row '+(t===g.win?'win':'lose'));
    const L=E('div'); L.appendChild(E('span','nm',M[t[3]]));
    const dv=div(g.y,M[t[3]]); if(dv){const p=E('span','pill '+(dv==='East'?'e':'w'),dv);p.style.marginLeft='8px';L.appendChild(p)}
    r.appendChild(L); r.appendChild(E('div','sc',f2(t[6]))); box.appendChild(r);
  });
  const bw=boxOnly(g);
  if(open) box.appendChild(bw);
  else{
    const b=E('button','btn','Boxscore'); b.style.margin='10px 13px 13px';
    b.onclick=()=>{b.remove(); box.appendChild(bw)}; box.appendChild(b);
  }
  return box;
}
/* the two lineups, side by side — shared by the scoreboard card and the matchup rows */
function boxOnly(g,first){
  const M=D.mgrs, bw=E('div','box');
  [first||g.win, (first||g.win)===g.win?g.los:g.win].forEach(t=>{
    const d=E('div'); d.appendChild(E('h4',null,M[t[3]]+' · Starters '+f2(t[7].filter(e=>e[1]).reduce((s,e)=>s+e[4],0))));
    /* lineup order, not the order the archive happens to hold them in. The slot
       dictionary runs QB, RB, WR, TE, FLEX, D/ST, K, so its index sorts a lineup
       the way it reads on a scoreboard; the paired index keeps two backs or two
       receivers in the order they were set. */
    const st=t[7].filter(e=>e[1]).map((e,i)=>[e,i]).sort((a,b)=>a[0][0]-b[0][0]||a[1]-b[1]).map(x=>x[0]),
          be=t[7].filter(e=>!e[1]).sort((a,b)=>b[4]-a[4]);
    const tb=E('table'); const body=E('tbody');
    const row=(e,cls)=>{const r=E('tr',cls);
      r.appendChild(E('td','sl',D.slots[e[0]]));
      const p=E('td','p');
      if(D.players[e[2]]){ const a=E('button','plink',D.players[e[2]]);
        a.onclick=ev=>{ev.stopPropagation(); go('players',{p:e[2]})}; p.appendChild(a); }
      else p.textContent='—';
      r.appendChild(p); r.appendChild(E('td','n r',f2(e[4]))); body.appendChild(r)};
    st.forEach(e=>row(e));
    if(be.length){const sep=E('tr');const c=E('td','sl');c.colSpan=3;c.textContent='BENCH';c.style.paddingTop='8px';sep.appendChild(c);body.appendChild(sep);}
    be.forEach(e=>row(e,'be'));
    tb.appendChild(body); const sc=E('div','scroll'); sc.appendChild(tb); d.appendChild(sc);
    const nt=t[7].find(e=>e[5]>0); if(nt)d.appendChild(E('div','note','Note: '+D.notes[nt[5]]+'.'));
    bw.appendChild(d);
  });
  return bw;
}

VIEWS.scorigami=()=>{
  const out=E('div'), M=D.mgrs;
  out.appendChild(secH('The Scorigami Board'));
  const p=E('p','lede');
  p.textContent='Each square is a final score — winner’s points across, loser’s points down, both rounded. Shaded means it has happened; tap or hover one to see its games. This week picks out what the last slate landed on, new squares against repeats. Drag the dial to see the board as it stood after any season, or press play and watch it fill in.';
  out.appendChild(p);
  /* the dial: drag a season and the board fills in as it did that year */
  let timer=null, SQ=null;
  const latest=SEASONS[SEASONS.length-1];
  const firstY=new Map();
  elig().forEach(g=>{const k=R(g.win[6])+'|'+R(g.los[6]);
    if(!firstY.has(k)||g.y<firstY.get(k))firstY.set(k,g.y)});
  const newIn=y=>[...firstY.values()].filter(v=>v===y).length;
  let curY=(STATE.span&&STATE.span!=='all')?+STATE.span:latest;
  if(!SEASONS.includes(curY))curY=latest;

  const tl=E('div','tl');
  const play=E('button','btn pl','▶'); play.title='Play the board from 2020';
  const tlr=E('div','tlr');
  const rg=E('input'); rg.type='range'; rg.min=SEASONS[0]; rg.max=latest; rg.step=1; rg.value=curY;
  rg.setAttribute('aria-label','Seasons shown, through');
  const ticks=E('div','ticks');
  SEASONS.forEach(y=>{const s=E('span',y===curY?'on':null,"’"+String(y).slice(2));
    s.onclick=()=>{stop();show(y,true)}; ticks.appendChild(s)});
  tlr.appendChild(rg); tlr.appendChild(ticks);
  const yl=E('div','yr'); const yn=E('span','n',String(curY)), yc=E('small');
  yl.appendChild(yn); yl.appendChild(yc);
  tl.appendChild(play); tl.appendChild(tlr); tl.appendChild(yl);
  out.appendChild(tl);
  rg.oninput=()=>{stop(); show(+rg.value,false)};
  rg.onchange=()=>show(+rg.value,true);
  // every week the league has played, in order, so the board fills a week at a
  // time rather than a season at a time
  const STEPS=[];
  SEASONS.forEach(y=>[...new Set(elig().filter(g=>g.y===y).map(g=>g.w))]
    .sort((a,b)=>a-b).forEach(w=>STEPS.push([y,w])));
  play.onclick=()=>{
    if(timer){stop();return}
    play.textContent='■';
    // paced on the clock, not on frames, so it runs a season a second on any machine
    const dur=SEASONS.length*1000, t0=performance.now();
    const frame=now=>{
      if(!document.body.contains(rg)){timer=null;return}
      const p=Math.min(1,(now-t0)/dur);
      if(p>=1){ timer=null; play.textContent='▶'; show(latest,true); return }
      const step=STEPS[Math.max(0,Math.min(STEPS.length-1,Math.floor(p*STEPS.length)))];
      if(!step){ timer=null; play.textContent='▶'; show(latest,true); return }
      showWeek(step[0],step[1]);
      timer=requestAnimationFrame(frame);
    };
    timer=requestAnimationFrame(frame);
  };

  const ctl=E('div','ctl');
  ctl.appendChild(E('span','pill','Color'));
  const mode=STATE.mode||'claimed';
  [['claimed','Claimed'],['week','This week'],['season','By season'],['latest','Latest'],['repeats','Repeats']].forEach(([v,t])=>{
    const b=E('button','btn',t); b.setAttribute('aria-pressed',v===mode?'true':'false');
    b.onclick=()=>{STATE.mode=v;render()}; ctl.appendChild(b);
  });
  const zc=E('span','pill','Size'); zc.style.marginLeft='4px'; ctl.appendChild(zc);
  const zbtns=[];
  [[1,'Fit'],[2,'Bigger'],[3,'Biggest']].forEach(([v,t])=>{
    const b=E('button','btn',t); b.setAttribute('aria-pressed',(STATE.zoom||1)===v?'true':'false');
    b.onclick=()=>{STATE.zoom=v; zbtns.forEach(x=>x[0].setAttribute('aria-pressed',x[1]===v?'true':'false'));
      drawBoard(SQ,mode);};
    zbtns.push([b,v]); ctl.appendChild(b);
  });
  const cb=E('button','btn','Color-blind'); cb.style.marginLeft='4px';
  cb.title='Swap the board, the heat ramp and the win/loss colors for palettes that read by lightness rather than hue. Remembered on this device.';
  cb.setAttribute('aria-pressed',cvdOn()?'true':'false');
  cb.onclick=()=>setCvd(!cvdOn());
  ctl.appendChild(cb);
  out.appendChild(ctl);

  const maxY=curY>=latest?null:curY;
  const sq=squares(maxY); SQ=sq;
  const nev=[...sq.values()].filter(a=>a.length===1).length;
  const games=elig().filter(g=>!maxY||g.y<=maxY);

  const bw=E('div','board-wrap'), bs=E('div','board-scroll'), cv=E('canvas');
  cv.id='board'; bs.appendChild(cv); bw.appendChild(bs);
  const sw=(c,t)=>'<span><span class="sw" style="background:'+c+'"></span>'+t+'</span>';
  const lg=E('div','legend');
  function fillLegend(mY){
    let L='';
    if(mode==='claimed') L=sw('var(--sg-claimed)','Claimed')+sw('var(--sg-cell)','Never')+sw('var(--sg-void)','Impossible');
    else if(mode==='week'){
      const lw=weekOf(SQ), n=lw?freshIn(SQ,lw):0, r=lw?hitIn(SQ,lw)-n:0;
      L='<span class="i" style="letter-spacing:.1em">'+(lw?'Week '+lw[1]+' \u00b7 '+lw[0]:'No games yet')+'</span>'+
        sw('var(--sg-new)',n+(n===1?' new square':' new squares'))+
        sw('var(--sg-rep)',r+(r===1?' repeat':' repeats'))+
        sw('var(--sg-old)','Claimed before')+sw('var(--sg-cell)','Never');
    }
    else if(mode==='season'||mode==='latest')
      L='<span class="i" style="letter-spacing:.1em">'+(mode==='season'?'First claimed':'Last claimed')+'</span>'+
        SEASONS.filter(y=>!mY||y<=mY).map(y=>sw('var(--sg-y'+(y-2020)+')',y)).join('')+sw('var(--sg-void)','Impossible');
    else L=sw('var(--heat2)','Once')+sw('var(--heat3)','Twice')+sw('var(--heat4)','3×')+sw('var(--sg-void)','Impossible');
    lg.innerHTML=L+'<span style="margin-left:auto">Winner →  ·  Loser ↓</span>';
  }
  fillLegend(maxY);
  bw.appendChild(lg);
  const ro=E('div','readout'); ro.id='sg-readout';
  ro.innerHTML='<span class="hint">Tap a shaded square to see its game. Use Bigger if they are hard to hit.</span>';
  bw.appendChild(ro);
  const fn=E('div','note'); fn.style.marginTop='9px';
  fn.textContent='Consolation-bracket games are left out: teams that have given up put up lows they never reached honestly.';
  bw.appendChild(fn);
  out.appendChild(bw);

  const detail=E('div'); detail.id='sg-detail'; detail.style.marginTop='18px'; out.appendChild(detail);

  const g1=E('div','grid-auto'); g1.style.marginTop='18px';
  function fillTiles(sqx,gms){
    g1.innerHTML='';
    const nv=[...sqx.values()].filter(a=>a.length===1).length;
    g1.appendChild(tile(sqx.size,'Squares claimed'));
    g1.appendChild(tile(gms.length,'Games counted'));
    g1.appendChild(tile((100*nv/sqx.size).toFixed(1)+'%','Never repeated'));
    /* a square rarely holds the record alone — three of them are on three games
       apiece — so name them all, and fall back to a count once the dial is far
       enough back that the record is two games and forty-one squares have it. */
    const mx=Math.max(0,...[...sqx.values()].map(a=>a.length));
    const tied=[...sqx.keys()].filter(k=>sqx.get(k).length===mx)
      .map(k=>k.split('|').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    if(mx) g1.appendChild(tile(mx+'×','Most repeated',
      tied.length<=4 ? tied.map(p=>p[0]+' – '+p[1]).join('  ·  ')
                     : tied.length+' squares tied'));
  }
  fillTiles(sq,games);
  out.appendChild(g1);

  const newest=E('div');
  function fillNewest(gms){
    newest.innerHTML=''; newest.appendChild(secH('Newest Squares'));
    const firsts=new Map();
    gms.forEach(g=>{const k=R(g.win[6])+'|'+R(g.los[6]); if(!firsts.has(k))firsts.set(k,g)});
    const recent=[...firsts.values()].sort((a,b)=>b.y-a.y||b.w-a.w).slice(0,12);
    newest.appendChild(tbl([
      {h:'Square',n:true,f:g=>'<strong>'+R(g.win[6])+' – '+R(g.los[6])+'</strong>'},
      {h:'Winner',f:g=>M[g.win[3]]},{h:'Pts',r:true,n:true,f:g=>f2(g.win[6])},
      {h:'Loser',f:g=>M[g.los[3]]},{h:'Pts',r:true,n:true,f:g=>f2(g.los[6])},
      {h:'When',r:true,f:g=>whenLab(g.y,g.w,g.br)}
    ],recent,{click:g=>go('games',{y:g.y,w:g.w,focus:M[g.win[3]]})}));
  }
  fillNewest(games);
  out.appendChild(newest);

  out.appendChild(secH('How to Read the Board'));
  const rate=SEASONS.map(y=>{
    const gs=elig().filter(g=>g.y===y), seen=new Set();
    elig().forEach(g=>{if(g.y<y)seen.add(R(g.win[6])+'|'+R(g.los[6]))});
    let nu=0; gs.forEach(g=>{const k=R(g.win[6])+'|'+R(g.los[6]); if(!seen.has(k)){nu++;seen.add(k)}});
    return {y,n:nu,g:gs.length};
  });
  const faq=E('div','faq');
  const c1=E('div'), c2=E('div');
  [['What counts as a Scorigami',

    'Those are scores that cannot exist: the winner would have to score fewer points than the loser. The slope is the line where the two are equal, and everything below it is unreachable.']
  ].forEach(([t,b])=>{const d=E('div','card');d.appendChild(E('h3',null,t));d.appendChild(E('p',null,b));c1.appendChild(d)});
  [['Why consolation games are out',
    'Teams eliminated from the bracket stop setting lineups, and the lows they post were never reached honestly. Those games are excluded from the board, though they are still in the Games tab.'],
   ['It is getting harder',
    'Early on almost every game was new. ' + rate.map(r=>r.y+': '+Math.round(100*r.n/r.g)+'%').join(' · ') +

  ].forEach(([t,b])=>{const d=E('div','card');d.appendChild(E('h3',null,t));d.appendChild(E('p',null,b));c2.appendChild(d)});
  faq.appendChild(c1); faq.appendChild(c2); out.appendChild(faq);

  setTimeout(()=>{drawBoard(sq,mode); caption(curY);},0);
  return out;

  function caption(y){
    yn.textContent=y;
    yc.textContent=y===SEASONS[0]?newIn(y)+' squares to start'
      :'+'+newIn(y)+' new'+(y===latest?' so far':'');
    [...ticks.children].forEach((s,i)=>s.classList.toggle('on',SEASONS[i]===y));
  }
  /* one frame of the animation: the board as it stood after a given week */
  function showWeek(y,w){
    curY=y; STATE.span=y>=latest?'all':String(y); SQ=squares(y,w);
    rg.value=y; yn.textContent=y; yc.textContent='Week '+w;
    [...ticks.children].forEach((n,i)=>n.classList.toggle('on',SEASONS[i]===y));
    fillLegend(y); drawBoard(SQ,mode);
    fillTiles(SQ,elig().filter(g=>g.y<y||(g.y===y&&g.w<=w)));
  }
  /* redraw in place rather than re-render: dragging has to keep up with the thumb */
  function show(y,settle){
    curY=y; STATE.span=y>=latest?'all':String(y); STATE.cell=null;
    const mY=y>=latest?null:y, s2=squares(mY), gms=elig().filter(g=>!mY||g.y<=mY);
    SQ=s2; rg.value=y; caption(y);
    fillLegend(mY); drawBoard(s2,mode); fillTiles(s2,gms);
    const ro=$('#sg-readout'), dt=$('#sg-detail');
    if(ro)ro.innerHTML='<span class="hint">Tap a shaded square to see its game. Use Bigger if they are hard to hit.</span>';
    if(dt)dt.innerHTML='';
    if(settle)fillNewest(gms);
  }
  function stop(){ if(timer){cancelAnimationFrame(timer);timer=null;play.textContent='▶';show(curY,true)} }
};

/* Manager of the Year. Regular season only. */
const COTY={2020:'Owen',2021:'Michael',2022:'James D',2023:'Ayush',2024:'Jon',2025:'Ayush'};

/* Rookie of the Year: the most regular season points started by anyone in his
   first NFL season. Drafted classes come off the league's own records; James
   Robinson came into 2020 undrafted and still outscored the lot. */
const ROY={2020:['James Robinson',170.70],2021:['Najee Harris',241.00],2022:['Dameon Pierce',166.40],2023:['Puka Nacua',200.50],2024:['Jayden Daniels',239.52],2025:['Ashton Jeanty',183.40]};

/* Roster moves made after the last week in the archive, so no boxscore shows
   them yet. Clear each entry once the week it happened in has been pulled.
   Bobby <-> Alex, the night Week 5 closed. */
const RECENT_MOVES={};
const MVP_BAND={QB:[15,28],RB:[29,42],WR:[43,56],TE:[15,28]};
/* Replacement value is fixed per season and written down rather than worked
   out again on every load, so that a finished ladder can never move: the
   league's own QB2s, RB3s, WR4s and TE2s, each man scored over every week
   somebody held him, blanks included, because that is what the wire pays.
   Only the live season's line changes, once a week, as the season fills in. */
const RV_TABLE={
  2020:{QB:14.1247,RB:8.2589,WR:8.4790,TE:6.3326},
  2021:{QB:13.2795,RB:8.8395,WR:8.0074,TE:6.4280},
  2022:{QB:12.1286,RB:8.9767,WR:8.1191,TE:6.2442},
  2023:{QB:12.8441,RB:8.5313,WR:8.0869,TE:6.8279},
  2024:{QB:12.8509,RB:8.0432,WR:8.8973,TE:6.3760},
  2025:{QB:12.3814,RB:8.6943,WR:7.7435,TE:7.0375},
  2026:{QB:13.0565,RB:7.5524,WR:7.8562,TE:5.4664}};
/* A baseline for an earlier week of the live season, needed only when the
   method behind the numbers changes mid-season: without it last week's
   ladder, and so this week's movement on it, would be scored against a
   baseline that did not exist last week. Empty while nothing has changed. */
const RV_ASOF={};
const RV_YEARS=Object.keys(RV_TABLE).map(Number).sort((a,b)=>a-b);
function rvFor(y,upto){
  if(upto&&RV_ASOF[y]&&RV_ASOF[y][upto]) return RV_ASOF[y][upto];
  return RV_TABLE[y]||RV_TABLE[RV_YEARS[RV_YEARS.length-1]];
}
const MVP_CACHE={};
/* `upto` runs the same formula against a shorter season, which is how last
   week's ladder — and so the week's movement — is worked out. */
function mvpLadder(year,upto){
  const Y=year||SEASONS[SEASONS.length-1], CK=Y+'|'+(upto||'');
  if(MVP_CACHE[CK]) return MVP_CACHE[CK];
  const M=D.mgrs, byw={}, inRange=t=>t[0]===Y&&t[2]===BR_REG&&(!upto||t[1]<=upto);
  // regular season only, the same basis the league uses for records
  D.tw.forEach(t=>{ if(inRange(t)) byw[t[1]+'|'+t[3]]=t; });
  const weeks=[...new Set(D.tw.filter(inRange).map(t=>t[1]))].sort((a,b)=>a-b);
  const pl={};
  Object.values(byw).forEach(t=>{
    const opp=byw[t[1]+'|'+t[4]];
    t[7].forEach(([slot,started,pid,pos,pts])=>{
      const nm=D.players[pid], pn=D.pos[pos]||'';
      if(!pl[nm]) pl[nm]={name:nm,id:pid,pos:pn,wk:[]};
      if(!pl[nm].pos) pl[nm].pos=pn;
      pl[nm].wk.push({w:t[1],pts,started:started===1,mgr:M[t[3]],pf:t[6],
                      pa:opp?opp[6]:null,won:t[5]===1});
    });
  });
  const GPof=p=>p.wk.filter(v=>v.pts>0).length;
  const PFGof=p=>{const g=GPof(p); return g?p.wk.filter(v=>v.pts>0).reduce((s,v)=>s+v.pts,0)/g:0};
  const minG=Math.max(3,Math.ceil(weeks.length*0.6));
  const elig=Object.values(pl).filter(p=>MVP_BAND[p.pos]&&GPof(p)>=minG);
  const RV=rvFor(Y,upto), SECOND={}, FIRST={};
  Object.keys(MVP_BAND).forEach(pos=>{
    const ranked=elig.filter(p=>p.pos===pos).map(PFGof).sort((a,b)=>b-a);
    FIRST[pos]=ranked[0]||0; SECOND[pos]=ranked[1]||0;
  });
  const rows=elig.map(p=>{
    const rv=RV[p.pos], g=GPof(p), f=PFGof(p);
    let GW=0,WAR=0,LBR=0,GAR=0;
    p.wk.forEach(v=>{
      if(v.pts>rv) GAR++;
      if(!v.started||v.pa==null) return;
      if(v.won){ GW++; if(+(v.pf-v.pts+rv).toFixed(2) < v.pa) WAR++; }
      else if(+(v.pf-v.pts+rv).toFixed(2) > v.pa) LBR++;
    });
    const PAR=f-rv, POS=f-SECOND[p.pos];
    // whoever holds him most recently, not whoever held him longest
    const mgr=(Y===SEASONS[SEASONS.length-1]&&RECENT_MOVES[p.name])
      || p.wk.reduce((a,v)=>v.w>a.w?v:a,p.wk[0]).mgr;
    return {name:p.name,pos:p.pos,mgr,pfg:f,par:PAR,gp:g,gw:GW,pos2:POS,gar:GAR,war:WAR,lbr:LBR,
            score:f+PAR+g+GW*1.5+POS*2+GAR+WAR*4-LBR*4};
  }).sort((a,b)=>b.score-a.score);
  MVP_CACHE[CK]={year:Y,weeks:weeks.length,lastWeek:weeks[weeks.length-1],minG,RV,rows,
             qualified:Object.fromEntries(Object.keys(MVP_BAND).map(p=>[p,elig.filter(x=>x.pos===p).length]))};
  return MVP_CACHE[CK];
}
/* Where each player sat a week ago: +n climbed, -n slipped, null is new to the ladder. */
function mvpMoves(L){
  if(!L.lastWeek||L.weeks<2) return null;
  const was={}; mvpLadder(L.year,L.lastWeek-1).rows.forEach((r,i)=>was[r.name]=i+1);
  const mv={}; L.rows.forEach((r,i)=>{ mv[r.name]=was[r.name]==null?null:was[r.name]-(i+1); });
  return mv;
}

/* Every season's ladder added up, so a career can be read off it. A player
   scores nothing for a season he was not eligible in — too few games, or a
   position the award does not cover. */
let MVPCAR=null;
function mvpCareer(){
  if(MVPCAR)return MVPCAR;
  const by=new Map();
  SEASONS.forEach(y=>{
    const L=mvpLadder(y);
    L.rows.forEach((r,i)=>{
      if(!by.has(r.name)) by.set(r.name,{name:r.name,pos:r.pos,total:0,best:0,wins:0,seasons:[]});
      const c=by.get(r.name);
      c.total+=r.score; c.seasons.push({y,score:r.score,rank:i+1});
      if(r.score>c.best) c.best=r.score;
      if(i===0) c.wins++;
    });
  });
  const all=[...by.values()].sort((a,b)=>b.total-a.total);
  all.forEach((c,i)=>c.rank=i+1);
  return (MVPCAR={by,all});
}

/* All-Pro. One QB, two RB, two WR, one TE, one K, then a FLEX — the best
   remaining RB, WR or TE. Second and third teams carry straight on down the
   same list, so nobody is picked twice. Regular season only, and only points
   a player scored while he was actually in someone's starting lineup. */
const AP_SLOTS=[['QB',1],['RB',2],['WR',2],['TE',1],['K',1]];
const AP_FLEX=new Set(['RB','WR','TE']);
const AP_TEAM=['First Team','Second Team','Third Team'];
let APRO=null;
function allPro(){
  if(APRO)return APRO;
  const by={};
  D.tw.forEach(t=>{
    if(t[2]!==BR_REG)return;
    t[7].forEach(e=>{
      if(!e[1])return;                       // bench weeks do not count
      const nm=D.players[e[2]], p=D.pos[e[3]]||'';
      const yr=by[t[0]]||(by[t[0]]={});
      const r=yr[nm]||(yr[nm]={name:nm,pos:p,id:e[2],pts:0,st:0});
      if(!r.pos)r.pos=p;
      r.pts+=e[4]; r.st++;
    });
  });
  const teams={}, byPlayer=new Map();
  // a season gets its teams once it has a champion, so nothing is handed out mid-year
  const done=SEASONS.filter(y=>CHAMP[y]);
  done.forEach(y=>{
    const pool=Object.values(by[y]||{}).sort((a,b)=>b.pts-a.pts);
    const used=new Set(), sides=[];
    for(let t=0;t<3;t++){
      const side=[];
      const take=(test,slot)=>{
        const p=pool.find(x=>!used.has(x.name)&&test(x));
        if(!p)return;
        used.add(p.name);
        side.push(Object.assign({},p,{slot}));
        if(!byPlayer.has(p.name))byPlayer.set(p.name,[]);

const PB_SIDE=['East','West'];
let PBOWL=null;
function proBowl(){
  if(PBOWL)return PBOWL;
  const by={};
  D.tw.forEach(t=>{
    if(t[2]!==BR_REG)return;
    const conf=((D.div||{})[t[0]]||{})[t[3]]||'';
    t[7].forEach(e=>{
      if(!e[1])return;
      const nm=D.players[e[2]], p=D.pos[e[3]]||'';
      const yr=by[t[0]]||(by[t[0]]={});
      const r=yr[nm]||(yr[nm]={name:nm,pos:p,id:e[2],pts:0,st:0,last:-1,side:''});
      if(!r.pos)r.pos=p;
      r.pts+=e[4]; r.st++;
      if(conf&&t[1]>=r.last){ r.last=t[1]; r.side=conf; }   // whoever started him last
    });
  });
  const teams={}, byPlayer=new Map();
  const done=SEASONS.filter(y=>CHAMP[y]);
  done.forEach(y=>{
    const all=Object.values(by[y]||{});
    const sides={};
    PB_SIDE.forEach(side=>{
      const pool=all.filter(x=>x.side===side).sort((a,b)=>b.pts-a.pts);
      const used=new Set(), team=[];
      const take=test=>{
        const p=pool.find(x=>!used.has(x.name)&&test(x));
        if(!p)return;
        used.add(p.name);
        team.push(Object.assign({},p,{slot:p.pos}));       // flex picks list at their own position
        if(!byPlayer.has(p.name))byPlayer.set(p.name,[]);
        byPlayer.get(p.name).push({y,side,slot:p.pos,pts:p.pts});
      };
      for(let pass=0;pass<3;pass++){                       // three times down the list
        AP_SLOTS.forEach(([pos,n])=>{ for(let i=0;i<n;i++) take(x=>x.pos===pos); });
        take(x=>AP_FLEX.has(x.pos));
      }
      team.sort((a,b)=>PB_ORDER[a.slot]-PB_ORDER[b.slot]||b.pts-a.pts);
      sides[side]=team;
    });
    teams[y]=sides;
  });
  return (PBOWL={teams,byPlayer,seasons:done});
}

    line(rr[3]===1?'Ring':'Rings',
      YRS.map((y,i)=>rr[2][i]?'<span class="rg rg'+rr[2][i]+'" title="'+RING_LVL[rr[2][i]]+'"></span>&nbsp;'+y:'')
         .filter(Boolean).join('&nbsp;&nbsp; '),true);
    const agh=YRS.filter((y,i)=>rr[2][i]===4);
    if(agh.length) line('Agholor MVP',agh.join(', '),true);
  }
  const mvp=Object.keys(AWARDED).filter(y=>sameName(AWARDED[y],s.name));
  if(mvp.length) line('Season MVP',mvp.join(', '));
  const roy=Object.keys(ROY).filter(y=>sameName(ROY[y][0],s.name));
  if(roy.length) line('Rookie of the Year',roy.join(', '));
  const AR=allRookie();
  const ar=Object.keys(AR).filter(y=>AR[y].some(p=>sameName(p.name,s.name)));
  if(ar.length) line('All-Rookie',ar.join(',\u2003'));
  const ap=allPro().byPlayer.get(s.name);
  if(ap&&ap.length){
    const by=[[],[],[]];
    ap.slice().sort((a,b)=>a.y-b.y).forEach(r=>by[r.team].push(r.y+' <span style="opacity:.6">'+r.slot+'</span>'));
    line(ap.length===1?'All-Pro':'All-Pro \u00d7'+ap.length,
      by.map((v,i)=>v.length?'<strong>'+AP_TEAM[i]+'</strong> '+v.join(', '):'')
        .filter(Boolean).join('<br>'), by[0].length>0);
  }
  const pb=proBowl().byPlayer.get(s.name);
  if(pb&&pb.length){
    const yrs=pb.slice().sort((a,b)=>a.y-b.y).map(r=>r.y+
      ' <span style="opacity:.55">'+r.side+'</span>');
    line(pb.length===1?'Pro Bowl':'Pro Bowl \u00d7'+pb.length, yrs.join(',\u2003'));
  }
  return hon;
}
const RING_LVL={1:'On the roster',2:'Bench in the final',3:'Started the final',4:'Agholor MVP'};
const sameName=(a,b)=>String(a).replace(/[’']/g,"'")===String(b).replace(/[’']/g,"'");

/* Pick legible ink for a count printed on a colored square. */
function inkOn(fill){
  let r,g,b;
  const m=String(fill).match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if(m){ [,r,g,b]=m.map(Number); }
  else { let h=String(fill).trim().replace('#','');
    if(h.length===3) h=h.split('').map(x=>x+x).join('');
    const n=parseInt(h,16); if(isNaN(n))return '#fff';
    r=(n>>16)&255; g=(n>>8)&255; b=n&255; }
  return (0.2126*r+0.7152*g+0.0722*b)>150 ? '#15110f' : '#fff';
}

/* Hover text for a claimed square, in the workbook's own ScreenTip wording. */
function squareLine(arr){
  const M=D.mgrs;
  if(arr.length===1){
    const g=arr[0], when=roundName(g.y,g.w,g.br)||'Week '+g.w;
    return g.y+' '+when+'  ·  '+M[g.win[3]]+' '+f2(g.win[6])+' def. '+M[g.los[3]]+' '+f2(g.los[6]);
  }
  return 'Happened '+arr.length+' times ('+arr.map(g=>g.y).sort().join(', ')+')';
}

/* Axes follow the workbook: winner's score across, loser's score DOWN, so the
   cells where the winner scored fewer points than the loser form the black
   slope falling left-to-right. Nothing can ever land there. */
const AX={w0:57,w1:188,l0:32,l1:161};
/* the newest week represented on a board, and what landed on it */
function weekOf(sq){ let y=-1,w=-1;
  sq.forEach(arr=>arr.forEach(g=>{ if(g.y>y||(g.y===y&&g.w>w)){y=g.y;w=g.w} }));
  return y<0?null:[y,w]; }
function hitIn(sq,lw){ let n=0;
  sq.forEach(arr=>{ if(arr.some(g=>g.y===lw[0]&&g.w===lw[1]))n++ }); return n; }
function freshIn(sq,lw){ let n=0;
  sq.forEach(arr=>{ const f=arr.reduce((a,g)=>(g.y<a.y||(g.y===a.y&&g.w<a.w))?g:a,arr[0]);
    if(f.y===lw[0]&&f.w===lw[1])n++ }); return n; }
function drawBoard(sq,mode){
  const cv=$('#board'); if(!cv)return;
  const {w0,w1,l0,l1}=AX, nx=w1-w0+1, ny=l1-l0+1;
  const padL=2, padR=38, padT=20, padB=4, dpr=Math.min(2,window.devicePixelRatio||1);
  // "Fit" means the whole board on screen, so it is bound by height as well as
  // width — the grid is 130 rows tall and a width-only fit ran off the bottom.
  // the wrapper shrink-wraps the canvas, so measure the column it sits in
  const availW=Math.max(260,(($('main')||{clientWidth:900}).clientWidth)-30-padL-padR);
  const railH=($('nav.rail')||{offsetHeight:44}).offsetHeight;
  const availH=Math.max(240,(window.innerHeight||800)-railH-110);
  // cells are wider than they are tall, as in the workbook: that fills the width
  // without the 130 rows running off the bottom
  const z=STATE.zoom||1, mult=z===1?1:z===2?2:3;
  // fractional, so the board fills the panel exactly instead of rounding 125px away
  const grow=(fit,floor)=>z===1?fit:Math.min(30,Math.max(floor,fit*mult));
  const csX=grow(Math.max(5,Math.min(16,availW/nx)),10);
  const csY=grow(Math.max(4,Math.min(16,availH/ny)),8);
  const cw=Math.round(padL+nx*csX)+padR, ch=Math.round(padT+ny*csY)+padB;
  cv.width=cw*dpr; cv.height=ch*dpr; cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const S=getComputedStyle(document.body), col=n=>S.getPropertyValue(n).trim();
  const heat=[col('--heat2'),col('--heat3'),col('--heat4')];
  const yr=[0,1,2,3,4,5,6].map(i=>col('--sg-y'+i));
  const X=ws=>padL+(ws-w0)*csX, Y=ls=>padT+(ls-l0)*csY;
  // snap to the device pixel grid, not the CSS one, or fractional cells leave
  // hairline seams once the canvas is scaled by devicePixelRatio
  const snap=v=>Math.round(v*dpr)/dpr;
  const RX=ws=>snap(X(ws)), RY=ls=>snap(Y(ls));
  const cell=(ws,ls)=>[RX(ws),RY(ls),RX(ws+1)-RX(ws),RY(ls+1)-RY(ls)];
  c.clearRect(0,0,cw,ch);
  // playable ground, then the impossible slope
  c.fillStyle=col('--sg-cell'); c.fillRect(padL,padT,RX(w1+1)-padL,RY(l1+1)-padT);
  c.fillStyle=col('--sg-void');
  for(let ls=l0;ls<=l1;ls++){ const last=Math.min(w1,ls-1); if(last<w0)continue;
    c.fillRect(padL,RY(ls),RX(last+1)-padL,RY(ls+1)-RY(ls)); }
  /* "This week" means the newest week on the board, whatever the dial is set
     to — so it follows a drag back through the seasons, and the animation
     lights up each week as it lands. A square is new if its first game is
     that week and a repeat if it was already claimed. */
  const LW=mode==='week'?weekOf(sq):null;
  const inLW=g=>LW&&g.y===LW[0]&&g.w===LW[1];
  const weekFill=arr=>{
    if(!arr.some(inLW)) return col('--sg-old');
    const first=arr.reduce((a,g)=>(g.y<a.y||(g.y===a.y&&g.w<a.w))?g:a,arr[0]);
    return col(inLW(first)?'--sg-new':'--sg-rep');
  };
  const fillFor=arr=>
    mode==='season' ? (yr[Math.min(...arr.map(g=>g.y))-2020]||yr[6])
  : mode==='latest' ? (yr[Math.max(...arr.map(g=>g.y))-2020]||yr[6])
  : mode==='repeats'? heat[Math.min(2,arr.length-1)]
  : mode==='week'   ? weekFill(arr)
  : col('--sg-claimed');
  sq.forEach((arr,k)=>{ const [ws,ls]=k.split('|').map(Number);
    c.fillStyle=fillFor(arr); c.fillRect(...cell(ws,ls)); });
  // once cells are big enough, print how many games landed on each
  if(Math.min(csX,csY)>=13){
    c.font='600 '+Math.round(Math.min(csX,csY)*.62)+'px '+S.getPropertyValue('--f-data');
    c.textAlign='center'; c.textBaseline='middle';
    sq.forEach((arr,k)=>{ const [ws,ls]=k.split('|').map(Number);
      c.fillStyle=inkOn(fillFor(arr));
      c.fillText(arr.length,X(ws)+csX/2,Y(ls)+csY/2+.5); });
  }
  // winner across the top, loser down the right
  c.fillStyle=col('--muted'); c.font='600 9px '+S.getPropertyValue('--f-data');
  c.textAlign='left'; c.textBaseline='middle';
  for(let v=Math.ceil(l0/20)*20; v<=l1; v+=20) c.fillText(v,padL+nx*csX+6,Y(v)+csY/2);
  c.textAlign='center'; c.textBaseline='bottom';
  for(let v=Math.ceil(w0/20)*20; v<=w1; v+=20) c.fillText(v,X(v)+csX/2,padT-6);

  const at=ev=>{ const r=cv.getBoundingClientRect();
    return [w0+Math.floor((ev.clientX-r.left-padL)/csX), l0+Math.floor((ev.clientY-r.top-padT)/csY),
            ev.clientX-r.left, ev.clientY-r.top] };
  const tip=$('#tip');
  cv.onmousemove=ev=>{
    const [ws,ls,x,y]=at(ev);
    if(x<padL||y<padT||y>padT+ny*csY||ws<w0||ws>w1||ls<l0||ls>l1){tip.style.opacity=0;cv.style.cursor='default';return}
    const arr=sq.get(ws+'|'+ls);
    if(!arr){tip.style.opacity=0;cv.style.cursor='default';return}
    tip.innerHTML='<b>'+ws+' – '+ls+'</b>\n'+squareLine(arr);
    tip.style.opacity=1;
    const tw=tip.offsetWidth, th=tip.offsetHeight, below=ev.clientY<th+20;
    tip.style.left=Math.max(8,Math.min(innerWidth-tw-10,ev.clientX+14))+'px';
    tip.style.top=(below?ev.clientY+18:ev.clientY-th-10)+'px';
    cv.style.cursor='pointer';
  };
  cv.onmouseleave=()=>{tip.style.opacity=0};
  cv.onclick=ev=>{
    const [ws,ls]=at(ev), arr=sq.get(ws+'|'+ls), ro=$('#sg-readout'), d=$('#sg-detail');
    if(ro) ro.innerHTML=arr ? '<b>'+ws+' – '+ls+'</b>'+squareLine(arr)+
        '<span class="hint">  ·  full scoreboard below ↓</span>'
      : '<span class="hint">'+(ws<ls?'Impossible — the winner cannot score fewer points than the loser.'
        :ws>=w0&&ws<=w1&&ls>=l0&&ls<=l1?ws+' – '+ls+' has never happened.':'Tap a shaded square to see its game.')+'</span>';
    if(!d||!arr)return; d.innerHTML='';
    d.appendChild(secH('Square '+ws+' – '+ls+' · '+arr.length+(arr.length>1?' games':' game')));
    arr.slice().sort((a,b)=>b.y-a.y||b.w-a.w).forEach(g=>d.appendChild(scoreboard(g,arr.length===1)));
    if(!matchMedia('(hover:none)').matches) d.scrollIntoView({behavior:'smooth',block:'start'});
  };
}

VIEWS.games=()=>{
  const M=D.mgrs, out=E('div');

    .flatMap(g=>[...credits(M[g.win[3]]),...credits(M[g.los[3]])]))].sort();

    chip('All weeks',w==='all','Every game of the season',()=>set({w:'all',focus:null}));

  function records(y){

    G.filter(g=>g.y===y&&g.br===BR_REG).sort((a,b)=>a.w-b.w).forEach(g=>{
      [[M[g.win[3]],1],[M[g.los[3]],0]].forEach(([m,won])=>{
        run[m]=run[m]||[0,0]; run[m][won?0:1]++;
        r[m+'|'+g.w]=r[m+'|last']=run[m][0]+'-'+run[m][1];
      });
    });

  }
  function rec(m,g){ const v=REC[m+'|'+g.w]||REC[m+'|last']; return v?'('+v+')':'' }

  function weekList(L){
    (w==='all'?weeks:[w]).forEach(k=>{
      const gs=G.filter(g=>g.y===y&&g.w===k).sort((a,b)=>a.br-b.br||b.win[6]-a.win[6]);
      const hi=gs.reduce((a,g)=>Math.max(a,g.win[6]),0);

    const pf=reg.reduce((s,g)=>s+mine(g)[6],0), pa=reg.reduce((s,g)=>s+(mine(g)===g.win?g.los:g.win)[6],0);

  /* one game as a row: both sides, the arrow on the winner, the boxscore a tap away */
  function matchup(g,lead){
    const left = lead ? (owns(M[g.win[3]],lead)?g.win:g.los) : (g.los[3]<g.win[3]?g.los:g.win);
    const right = left===g.win?g.los:g.win;

    const row=E('button','mu-row'+(lead?' lead':'')); row.type='button';
    row.setAttribute('aria-expanded','false');

      wk.appendChild(E('span',null,rn==='Championship'?'Final':rn==='Semi Final'?'Semis':rn==='Wildcard'?'Wild Card':rn==='Consolation'?'Cons.':'Week '+g.w));
      wk.appendChild(E('span','rs'+(left===g.win?' won':''),left===g.win?'Won':'Lost')); }
    row.appendChild(wk);

        d.appendChild(E('b',null,f2(hi[4]))); s.appendChild(d); }
      return s };
    const sc=(t,cls)=>E('div','sc '+cls+(t===g.win?' w':''),f2(t[6]));
    row.appendChild(side(left,'a')); row.appendChild(sc(left,'s1'));
    row.appendChild(E('div','ar',left===g.win?'◀':'▶'));
    row.appendChild(sc(right,'s2')); row.appendChild(side(right,'b'));

    row.onclick=()=>{ const on=wrap.classList.toggle('open');
      row.setAttribute('aria-expanded',on?'true':'false');

      (dr.length>1?' · taken '+dr.length+'×':'')));
  } else g1.appendChild(tile('Undrafted','In this league','never taken in a draft'));
  g1.appendChild(tile(one.mgrs.size,one.mgrs.size===1?'Manager':'Managers',[...one.mgrs].join(' · ')));
  const top=[...one.byMgr.values()].sort((a,b)=>b.starts-a.starts||b.spts-a.spts)[0];
  if(top&&top.starts){
    const tied=[...one.byMgr.values()].filter(x=>x.starts===top.starts);
    g1.appendChild(tile(tied.length>1?tied.length+' tied':top.m,'Started him most',
      tied.length>1?tied.map(x=>x.m).join(' · ')+' · '+top.starts+' each'
                   :top.starts+' of '+one.starts+' starts · '+f2(top.spts)+' pts'));
  }
  const ys=[...one.seasons].sort();
  g1.appendChild(tile(ys.length,ys.length===1?'Season':'Seasons',
    ys.length>1?ys[0]+'–'+ys[ys.length-1]:String(ys[0])));
  out.appendChild(g1);

  out.appendChild(secH('Season by season'));
  out.appendChild(E('p','lede','Click a season to open that year\u2019s game log. Consolation weeks are left out, as they are everywhere else.'+(lines.some(l=>l.br===BR_PO)&&lines.some(l=>l.br===BR_REG)?' The chips split the regular season from the playoffs.':'')));
  out.appendChild(seasonTable(one,lines));
  return out;
}

/* What a man did in one season here, and the honors that came with it. */
function seasonLine(name,y){
  const tags=[];
  if(sameName(AWARDED[y]||'',name)) tags.push(['MVP','g']);
  if(ROY[y]&&sameName(ROY[y][0],name)) tags.push(['ROY','g']);
  const ap=(allPro().byPlayer.get(name)||[]).find(r=>r.y===y);
  if(ap) tags.push(['AP'+(ap.team+1),ap.team===0?'g':'']);
  const pb=(proBowl().byPlayer.get(name)||[]).find(r=>r.y===y);
  if(pb) tags.push(['PB','']);
  if((allRookie()[y]||[]).some(p=>sameName(p.name,name))) tags.push(['All-Rk','']);
  const YRS=D.ringYears||[], rr=(D.rings||[]).find(x=>sameName(x[0],name)), i=YRS.indexOf(y);
  if(rr&&i>=0&&rr[2][i]) tags.push([RING_LVL[rr[2][i]]==='Agholor MVP'?'Agholor':'Ring','g']);
  return tags;
}
/* Regular season and the playoffs are two different careers, so a chip keeps
   them apart. A man with no January football gets no chips at all. */
const PS_SCOPE=[['reg','Regular season',BR_REG],['po','Playoffs',BR_PO],['all','All games',null]];
function seasonTable(one,all){
  const wrap=E('div');
  const has=k=>PS_SCOPE.find(x=>x[0]===k)[2]===null||all.some(l=>l.br===PS_SCOPE.find(x=>x[0]===k)[2]);
  let k=PS_SCOPE.some(x=>x[0]===STATE.ps)?STATE.ps:'reg';
  if(!has(k))k='reg';
  const br=PS_SCOPE.find(x=>x[0]===k)[2];
  const lines=br===null?all:all.filter(l=>l.br===br);
  if(all.some(l=>l.br===BR_PO)&&all.some(l=>l.br===BR_REG)){
    const bar=E('div','wkbar');
    PS_SCOPE.forEach(([key,lab])=>{
      const b=E('button',null,lab);
      b.setAttribute('aria-pressed',key===k?'true':'false');
      b.onclick=()=>{STATE=Object.assign({},STATE,{ps:key}); render()};
      bar.appendChild(b);
    });
    wrap.appendChild(bar);
  }
  if(!lines.length){ wrap.appendChild(E('p','empty','No '+(k==='po'?'playoff':'regular season')+' games.')); return wrap }
  const sc=E('div','scroll'), t=E('table','seas'), th=E('thead'), tb=E('tbody');
  const cols=[['Season',''],['Managers',''],['G','r'],['GS','r'],['Pts','r'],
              ['P/GS','r'],['Best','r'],['W\u2013L','r'],['Honors','']];
  const hr=E('tr');
  cols.forEach(([h,c])=>{const x=E('th',(c?c+' ':'')+'hd'); x.appendChild(E('span','hl',h)); hr.appendChild(x)});
  th.appendChild(hr); t.appendChild(th); t.appendChild(tb);

  const by=new Map();
  lines.forEach(l=>{
    let r=by.get(l.y);
    if(!r){r={y:l.y,g:0,gs:0,pts:0,best:0,w:0,l:0,mgrs:[],rows:[]};by.set(l.y,r)}
    r.g++; r.rows.push(l);
    if(l.pts>r.best)r.best=l.pts;
    if(l.st){ r.gs++; r.pts+=l.pts; r[l.win?'w':'l']++; }
    if(r.mgrs.indexOf(l.m)<0)r.mgrs.push(l.m);
  });
  const years=[...by.keys()].sort((a,b)=>b-a);
  const tot={g:0,gs:0,pts:0,best:0,w:0,l:0};
  const open=new Set();

  years.forEach(y=>{
    const r=by.get(y);
    tot.g+=r.g; tot.gs+=r.gs; tot.pts+=r.pts; tot.w+=r.w; tot.l+=r.l;
    if(r.best>tot.best)tot.best=r.best;
    const tr=E('tr','clk');
    const yc=E('td'); const yb=E('button','ylink',String(y)); yc.appendChild(yb); tr.appendChild(yc);
    const cell=(v,c)=>{const d=E('td',c||null); d.innerHTML=v; tr.appendChild(d)};
    cell(r.mgrs.join(' \u00b7 '));
    cell(String(r.g),'r n'); cell(String(r.gs),'r n');
    cell('<strong>'+f2(r.pts)+'</strong>','r n');
    cell(r.gs?f2(r.pts/r.gs):'<span style="opacity:.35">\u2014</span>','r n');
    cell(f2(r.best),'r n');
    cell(r.gs?r.w+'\u2013'+r.l:'<span style="opacity:.35">\u2014</span>','r n');
    cell(seasonLine(one.name,y).map(([tg,g])=>'<span class="htag'+(g?' g':'')+'">'+tg+'</span>').join(' '));
    tb.appendChild(tr);

    // the game log, folded away until the year is clicked
    const log=E('tr','glog'), td=E('td'); td.colSpan=cols.length;
    const inner=E('table','glg'), ib=E('tbody');
    r.rows.slice().sort((a,b)=>a.y-b.y||a.w-b.w).forEach(l=>{
      const x=E('tr','clk');
      const c=(v,cl)=>{const d=E('td',cl||null); d.innerHTML=v; x.appendChild(d)};
      c(whenLab(l.y,l.w,l.br));
      c(l.st?l.sl:'<span style="opacity:.55">'+l.sl+'</span>');
      c('<strong>'+f2(l.pts)+'</strong>','r n');
      c(l.m+' <span style="opacity:.55">vs '+l.opp+'</span>');
      c('<span class="'+(l.win?'wn':'ls')+'">'+(l.win?'W':'L')+'</span> '+
        '<span style="opacity:.55">'+f2(l.tot)+'</span>','r n');
      x.onclick=()=>go('games',{y:l.y,w:l.w,focus:l.m});
      ib.appendChild(x);
    });
    inner.appendChild(ib); td.appendChild(inner); log.appendChild(td); tb.appendChild(log);
    const flip=()=>{ const on=open.has(y); on?open.delete(y):open.add(y);
      log.classList.toggle('on',!on); yb.classList.toggle('on',!on); };
    tr.onclick=flip;
  });

  const tr=E('tr','tot');
  const c=(v,cl)=>{const d=E('td',cl||null); d.innerHTML=v; tr.appendChild(d)};
  c('<strong>'+years.length+(years.length===1?' season':' seasons')+'</strong>');
  const nm=new Set(lines.map(l=>l.m)).size;
  c('<span style="opacity:.6">'+nm+' manager'+(nm===1?'':'s')+'</span>');
  c(String(tot.g),'r n'); c(String(tot.gs),'r n');
  c('<strong>'+f2(tot.pts)+'</strong>','r n');
  c(tot.gs?f2(tot.pts/tot.gs):'\u2014','r n');
  c(f2(tot.best),'r n');
  c(tot.gs?tot.w+'\u2013'+tot.l:'\u2014','r n');
  c('');
  tb.appendChild(tr);
  sc.appendChild(t); wrap.appendChild(sc); return wrap;
}

/* One row per player, every career measure as a column — the table sorts and
   filters itself, so these no longer need to be separate boards. */
/* Regular season and the playoffs are different careers, so the table keeps
   them apart. Each scope carries its own sensible minimum: eight playoff starts
   is the most anyone has ever had, so ten would empty the table. */
const SCOPES={
  reg:{t:'Regular season',br:BR_REG,mins:[1,5,10,25,50],def:10,lab:'regular season'},
  po :{t:'Playoffs',      br:BR_PO, mins:[1,2,3,5],     def:1, lab:'playoff'},
  all:{t:'All games',     br:null,  mins:[1,5,10,25,50],def:10,lab:'career'}
};
const SCOPE_K=['reg','po','all'];
const SCOPED=new Map();
function careerRows(k){
  if(SCOPED.has(k))return SCOPED.get(k);
  const br=SCOPES[k].br, M=D.mgrs, by=new Map();
  D.tw.forEach(t=>{
    if(t[2]===BR_CON)return;
    if(br!==null&&t[2]!==br)return;
    t[7].forEach(e=>{
      let r=by.get(e[2]);
      if(!r){r={id:e[2],name:D.players[e[2]],pos:D.pos[e[3]]||'',
                starts:0,spts:0,best:0,won:0,mgrs:new Set()};by.set(e[2],r)}
      if(!r.pos)r.pos=D.pos[e[3]]||'';
      if(e[4]>r.best)r.best=e[4];            // best week counts bench ones too
      if(e[1]){ r.starts++; r.spts+=e[4]; if(t[5]===1)r.won++; }
      credits(M[t[3]]).forEach(mg=>r.mgrs.add(mg));
    });
  });
  const out=[...by.values()];
  SCOPED.set(k,out);
  return out;
}
const MIN_ST=[1,5,10,25,50];
const BOARDS=[
  {k:'all',   t:'All-time',    full:()=>careerTable()},
  {k:'ladder',t:'MVP Ladder',  full:()=>mvpBlock()},
  {k:'ring',  t:'Ring Counter',full:()=>ringCounter()},
  {k:'allpro',t:'Honors',      full:()=>honorsBlock()}
];
function careerTable(){
  const C=mvpCareer().by, PB=proBowl().byPlayer, AP=allPro().byPlayer, out=E('div');
  const rings=new Map((D.rings||[]).map(r=>[String(r[0]).replace(/[’']/g,"'"),r[3]]));
  const ringOf=n=>rings.get(String(n).replace(/[’']/g,"'"))||0;
  const sk=SCOPES[STATE.sc]?STATE.sc:'reg', SC=SCOPES[sk];
  const min=SC.mins.indexOf(STATE.min)>=0?STATE.min:SC.def;

  const ctl=E('div','ctl');

  const gs=E('select'); SCOPE_K.forEach(k=>{const o=E('option',null,SCOPES[k].t);o.value=k;gs.appendChild(o)});
  gs.value=sk;
  // each scope has its own floor, so switching never lands you on an empty table
  gs.onchange=()=>{STATE=Object.assign({},STATE,{sc:gs.value,min:SCOPES[gs.value].def}); render()};
  ctl.appendChild(gs);
  ctl.appendChild(E('span','pill','Minimum starts'));
  const ms=E('select'); SC.mins.forEach(v=>{const o=E('option',null,v);o.value=v;ms.appendChild(o)});
  ms.value=min; ms.onchange=()=>{STATE=Object.assign({},STATE,{min:+ms.value}); render()};
  ctl.appendChild(ms);

  const rows=careerRows(sk).filter(x=>x.starts>=min&&(!STATE.pos||x.pos===STATE.pos))
                  .sort((a,b)=>b.spts-a.spts);
  out.appendChild(E('p','lede',rows.length+' players with '+min+'+ '+SC.lab+' start'+(min===1?'':'s')+
    (STATE.pos?' at '+STATE.pos:'')+'. Click any heading to sort by it, or a row to open that player.'));
  out.appendChild(tbl([
    {h:'Player',f:r=>'<strong>'+r.name+'</strong>',filter:false},
    {h:'Pos',sm:false,f:r=>r.pos||'\u2014'},
    {h:'Starts',r:true,n:true,dim:true,f:r=>String(r.starts),filter:false},
    {h:'Points',r:true,n:true,f:r=>f2(r.spts),filter:false},
    {h:'Per start',r:true,n:true,sm:false,f:r=>f2(r.starts?r.spts/r.starts:0),filter:false},
    {h:'MVP pts',r:true,n:true,sm:false,filter:false,
     f:r=>C.has(r.name)?f2(C.get(r.name).total):'<span style="opacity:.35">—</span>'},
    {h:'Best week',r:true,n:true,sm:false,f:r=>f2(r.best),filter:false},
    {h:'Win %',r:true,n:true,sm:false,filter:false,
     f:r=>r.starts?(100*r.won/r.starts).toFixed(1)+'<span style="opacity:.45">%</span>':'<span style="opacity:.35">\u2014</span>'},
    {h:'All-Pro',r:true,n:true,sm:false,filter:false,
     f:r=>(AP.get(r.name)||[]).length||'<span style="opacity:.35">\u2014</span>'},
    {h:'Pro Bowls',r:true,n:true,sm:false,filter:false,
     f:r=>(PB.get(r.name)||[]).length||'<span style="opacity:.35">\u2014</span>'},
    {h:'Rings',r:true,n:true,sm:false,f:r=>ringOf(r.name)||'<span style="opacity:.35">\u2014</span>',filter:false},
    {h:'Mgrs',r:true,n:true,sm:false,f:r=>String(r.mgrs.size),filter:false}
  ],rows,{click:r=>go('players',{p:r.id}),cap:50}));
  return out;
}

/* The man a manager keeps writing into the lineup, counted off the same index
   the player pages use so that the two can never disagree: consolation weeks
   are out, as they are everywhere else here, and a shared team credits both
   men. Ties go to whoever scored more. */
function favPlayer(m){
  let best=null;
  playerStats().all.forEach(s=>{
    const u=s.byMgr.get(m);
    if(!u||!u.starts)return;
    if(best&&(u.starts<best.n||(u.starts===best.n&&u.spts<best.pts)||
        (u.starts===best.n&&u.spts===best.pts&&s.name.localeCompare(best.name)>=0)))return;
    best={id:s.id,name:s.name,pos:s.pos,n:u.starts,pts:u.spts};
  });
  if(best){
    let y0=Infinity,y1=-Infinity;
    D.tw.forEach(t=>{ if(t[2]===BR_CON||!owns(D.mgrs[t[3]],m))return;
      if(t[7].some(e=>e[1]===1&&e[2]===best.id)){ if(t[0]<y0)y0=t[0]; if(t[0]>y1)y1=t[0] } });
    best.y0=y0; best.y1=y1;
  }
  return best;
}

      if(d===null) return '<span class="mv nr">NR</span>';
      if(d===0) return '<span class="mv sm">–</span>';
      return '<span class="mv '+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+' '+Math.abs(d)+'</span>';
    }}||null,
    {h:'Player',f:r=>'<strong>'+r.name+'</strong>'},
    {h:'Pos',f:r=>r.pos},
    {h:'Manager',f:r=>r.mgr},
    {h:'PF/G',r:true,n:true,f:r=>f2(r.pfg)},
    {h:'PAR',r:true,n:true,sm:false,f:r=>f2(r.par)},
    {h:'GP',r:true,n:true,sm:false,f:r=>r.gp},
    {h:'GW',r:true,n:true,sm:false,f:r=>r.gw},
    {h:'POS',r:true,n:true,sm:false,f:r=>(r.pos2>0?'+':'')+f2(r.pos2)},
    {h:'GAR',r:true,n:true,sm:false,f:r=>r.gar},
    {h:'WAR',r:true,n:true,f:r=>r.war?'<strong style="color:var(--good)">'+r.war+'</strong>':'0'},
    {h:'LBR',r:true,n:true,f:r=>r.lbr?'<strong style="color:var(--bad)">'+r.lbr+'</strong>':'0'},
    {h:'MVP',r:true,n:true,f:r=>'<strong>'+f2(r.score)+'</strong>'}
  ];
